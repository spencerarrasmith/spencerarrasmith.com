<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Phonemes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&family=Noto+Sans:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0b0c18;
      --surface:      #111221;
      --surface-up:   #191a2e;
      --border:       #252648;
      --accent:       #c9981a;
      --accent-glow:  rgba(201, 152, 26, 0.16);
      --accent-light: #f5c842;
      --success:      #4ade80;
      --success-dim:  rgba(74, 222, 128, 0.12);
      --error:        #f87171;
      --error-dim:    rgba(248, 113, 113, 0.12);
      --text:         #fbf8ee;
      --text-dim:     #d0d0e8;
      --text-muted:   #9c9cc8;

      /* System bottom inset (home indicator / gesture bar). Falls back to a
         --safe-area-inset-bottom custom property if env() is unavailable. */
      --safe-bottom:  env(safe-area-inset-bottom, var(--safe-area-inset-bottom, 0px));
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Shell ────────────────────────────────── */
    .game-wrap {
      height: 100vh;   /* fallback */
      height: 100dvh;  /* excludes mobile browser toolbars */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────── */
    .g-header {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 11px 24px 10px;
    }

    .g-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .g-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .g-title-row { display: flex; align-items: center; gap: 10px; min-width: 0; }

    /* Direction toggle (🔀) next to the title */
    .rev-btn {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 26px;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      color: var(--text-dim);
      background: var(--surface-up);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      transition: background .12s, border-color .12s, transform .08s;
    }
    .rev-btn:hover { border-color: var(--accent); background: var(--accent-glow); }
    .rev-btn:active { transform: scale(.92); }
    .rev-btn:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }
    .rev-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-glow); }

    .g-stats {
      display: flex;
      gap: 20px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .g-stat-val { font-weight: 600; color: var(--text-dim); }

    .g-prog-track {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .g-prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius: 2px;
      width: 0%;
      transition: width .5s ease;
    }

    /* ── Controls bar ─────────────────────────── */
    .g-controls {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 7px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 20px;
    }

    .g-controls-sep {
      width: 1px;
      height: 14px;
      background: var(--border);
    }

    /* ── Rare badge (card corner pip) ─────────── */
    .rare-badge {
      position: absolute;
      top: 9px;
      right: 11px;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      background: var(--surface-up);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 5px;
    }

    /* ── Game body ────────────────────────────── */
    .g-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 26px 14px;
      gap: 12px;
      overflow: hidden;
    }

    /* ── Character card ───────────────────────── */
    .card-area {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* The signature element: warm amber halo on the card */
    /* 16:9 tile: wider and shorter than the old 160px square.
       Category label sits top-left, the "rare" pip top-right. */
    .char-card {
      position: relative;
      width: min(256px, 100%);
      aspect-ratio: 16 / 9;
      background: radial-gradient(ellipse at 50% 45%, #1e1830 0%, #111221 70%);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 32px rgba(0,0,0,.55),
        inset 0 0 48px rgba(201, 152, 26, 0.05);
      transition: border-color .18s, box-shadow .18s;
    }

    .char-card.correct {
      border-color: var(--success);
      box-shadow:
        0 0 24px rgba(74, 222, 128, .28),
        0 8px 32px rgba(0,0,0,.55);
      animation: pop .28s ease;
    }

    .char-card.wrong {
      border-color: var(--error);
      box-shadow:
        0 0 24px rgba(248, 113, 113, .28),
        0 8px 32px rgba(0,0,0,.55);
      animation: shake .32s ease;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      22%  { transform: translateX(-8px); }
      55%  { transform: translateX(8px); }
      80%  { transform: translateX(-4px); }
    }

    .cat-badge {
      position: absolute;
      top: 10px;
      left: 13px;
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .08em;
      line-height: 1.2;
      opacity: 1;
    }

    .cat-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .cat-toggle input[type=checkbox] {
      appearance: none;
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border: 1.5px solid var(--text-muted);
      border-radius: 3px;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background .12s, border-color .12s;
    }

    .cat-toggle input[type=checkbox]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .cat-toggle input[type=checkbox]:checked::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 3px;
      width: 4px;
      height: 7px;
      border: 1.5px solid #0b0c18;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .tel-char {
      font-family: 'Noto Sans Telugu', serif;
      font-size: 5.6rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-top: 26px;   /* Telugu ink sits high in its line box; this centres it and clears the label */
      user-select: none;
    }

    /* Reverse mode: the card shows the phoneme, written /like this/ */
    .tel-char.ipa-face {
      font-family: 'Noto Sans', 'Inter', system-ui, sans-serif;
      font-weight: 500;
      font-size: 5rem;
      letter-spacing: .01em;
      margin-top: 10px;
    }
    .ipa-face .sl { color: var(--text-muted); font-weight: 400; font-size: .7em; }

    .feedback {
      height: 20px;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .01em;
    }
    .feedback.te { font-family: 'Noto Sans Telugu', 'Inter', sans-serif; font-size: 16px; }
    .feedback.ok  { color: var(--success); }
    .feedback.err { color: var(--error); }

    /* ── Phoneme keyboard ─────────────────────── */
    .kb-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding-bottom: calc(16px + var(--safe-bottom));
      padding-right: 4px;

      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .kb-area::-webkit-scrollbar { width: 4px; }
    .kb-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .kb-group { display: flex; flex-direction: column; gap: 5px; }

    .kb-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .kb-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .kb-btn {
      padding: 6px 13px;
      min-width: 50px;
      background: var(--surface-up);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-family: 'Noto Sans', 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      cursor: pointer;
      transition: background .1s, border-color .1s, color .1s, transform .08s;
      user-select: none;
      text-align: center;
    }

    /* Telugu-faced keys (reverse mode) */
    .kb-btn.te {
      font-family: 'Noto Sans Telugu', 'Noto Sans', sans-serif;
      font-size: 22px;
      line-height: 1.35;
      padding: 4px 13px;
    }

    .kb-btn:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent-light);
    }

    .kb-btn:active { transform: scale(.92); }

    .kb-btn.ok {
      background: var(--success-dim);
      border-color: var(--success);
      color: var(--success);
    }

    .kb-btn.err {
      background: var(--error-dim);
      border-color: var(--error);
      color: var(--error);
    }

    /* ── Complete screen ──────────────────────── */
    .g-complete {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px;
      text-align: center;
    }

    .g-complete.show {
      display: flex;
      animation: fade-up .45s ease;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .trophy { font-size: 58px; animation: trophy-in .6s ease; }

    @keyframes trophy-in {
      from { transform: scale(.4) translateY(12px); opacity: 0; }
      70%  { transform: scale(1.14) translateY(-4px); opacity: 1; }
      to   { transform: scale(1); }
    }

    .c-title { font-size: 25px; font-weight: 700; color: var(--text); }
    .c-sub   { font-size: 14px; color: var(--text-dim); max-width: 340px; }

    .c-stats {
      display: flex;
      gap: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 28px;
    }

    .c-stat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .c-stat-val { font-size: 24px; font-weight: 700; color: var(--accent-light); }
    .c-stat-lbl { font-size: 11px; color: var(--text-muted); }

    .retry-btn {
      padding: 11px 36px;
      background: var(--accent);
      color: #0b0c18;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: filter .14s, transform .1s, box-shadow .14s;
      letter-spacing: .01em;
    }

    .retry-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(201, 152, 26, .45);
    }

    .retry-btn:active { transform: translateY(0); }

    @media (max-width: 520px) {
      .g-header   { padding-left: 16px; padding-right: 16px; }
      .g-controls { padding-left: 16px; padding-right: 16px; gap: 6px 16px; }
      .g-controls-sep { display: none; }
      .g-main     { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
<div class="game-wrap">

  <!-- ── Progress header ── -->
  <header class="g-header">
    <div class="g-header-top">
      <div class="g-title-row">
        <span class="g-title" id="g-title">Telugu → IPA</span>
        <button class="rev-btn" id="rev-btn" type="button" aria-pressed="false"
                aria-label="Reverse direction: IPA to Telugu" title="Reverse direction">🔀</button>
      </div>
      <div class="g-stats">
        <span>Remaining&nbsp;<span class="g-stat-val" id="s-rem">48</span></span>
        <span>Correct&nbsp;<span class="g-stat-val" id="s-done">0</span>/<span class="g-stat-val" id="s-total">48</span></span>
      </div>
    </div>
    <div class="g-prog-track">
      <div class="g-prog-fill" id="prog-fill"></div>
    </div>
  </header>

  <!-- ── Controls bar ── -->
  <div class="g-controls">
    <label class="cat-toggle"><input type="checkbox" id="show-cat" checked> Show category</label>
    <div class="g-controls-sep"></div>
    <label class="cat-toggle"><input type="checkbox" id="include-extra"> Include extra letters</label>
    <div class="g-controls-sep"></div>
    <label class="cat-toggle"><input type="checkbox" id="highlight-correct" checked> Highlight correct answer</label>
  </div>

  <!-- ── Game main ── -->
  <div class="g-main" id="g-main">
    <div class="card-area">
      <div class="char-card" id="char-card">
        <span class="cat-badge" id="cat-badge">Vowel</span>
        <span class="tel-char" id="tel-char">అ</span>
        <span class="rare-badge" id="rare-badge" style="display:none">rare</span>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="kb-area" id="kb-area"></div>
  </div>

  <!-- ── Complete screen ── -->
  <div class="g-complete" id="g-complete">
    <div class="trophy">🏆</div>
    <div class="c-title">Session Complete!</div>
    <div class="c-sub" id="c-sub">All Telugu akshara correctly matched to their IPA phonemes.</div>
    <div class="c-stats">
      <div class="c-stat">
        <span class="c-stat-val" id="c-attempts">—</span>
        <span class="c-stat-lbl">Total Attempts</span>
      </div>
      <div class="c-stat">
        <span class="c-stat-val" id="c-accuracy">—</span>
        <span class="c-stat-lbl">Accuracy</span>
      </div>
      <div class="c-stat">
        <span class="c-stat-val" id="c-errors">—</span>
        <span class="c-stat-lbl">Errors</span>
      </div>
    </div>
    <button class="retry-btn" id="retry-btn">Practice Again</button>
  </div>

</div>

<script src="telugu-data.js"></script>
<script src="progress.js"></script>
<script>
if (!window.TeluguData) throw new Error('telugu-data.js was not found next to this page');

/* ─────────────────────────────────────────────────────────
   DATA
   Letters, flags and keyboard groups all come from
   telugu-data.js. The book's set (51 cards) is the default;
   "Include extra letters" adds ఌ ౡ ఱ.
     rare    → "rare" badge on the card
     inBook  → false for the extras
───────────────────────────────────────────────────────── */
const GAME      = 'phonemes';            // tile id: finishing either direction ticks the tile
const CHARS     = TeluguData.letters;
const Progress  = window.TeluguProgress || { miss() {}, complete() {} };

/* ─────────────────────────────────────────────────────────
   STATE
   reversed = false → card shows the Telugu letter, keys show IPA
   reversed = true  → card shows the IPA phoneme, keys show Telugu
   The keyboard itself (layout, order, groups) is built by
   TeluguData.buildKeyboard, so it lives with the alphabet data.
───────────────────────────────────────────────────────── */
let deck = [], completed = 0, attempts = 0, locked = false, total = 0;
let reversed = false;

/* ─────────────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────────────── */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const escHtml = s => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Both keyboards share one key per letter; match by the letter itself
// (data-ch is unique, data-ipa is unique too, but the glyph is the identity).
function btnForLetter(letter) {
  return Array.from(document.querySelectorAll('.kb-btn'))
    .find(b => b.dataset.ch === letter.ch) || null;
}

/* ─────────────────────────────────────────────────────────
   BUILD KEYBOARD  (layout comes from telugu-data.js)
───────────────────────────────────────────────────────── */
function buildKB(activeLetters) {
  TeluguData.buildKeyboard(document.getElementById('kb-area'), {
    face:    reversed ? 'telugu' : 'ipa',
    visible: activeLetters,
    onPick:  onAnswer,
  });
}

/* ─────────────────────────────────────────────────────────
   RENDER CURRENT CARD
───────────────────────────────────────────────────────── */
function renderCard() {
  const c = deck[0];
  const tel = document.getElementById('tel-char');
  if (reversed) {
    // the phoneme, written /like this/; longer strings (tʃʰ, dʒʱ) step down a size
    const n = [...c.ipa].length;
    tel.className      = 'tel-char ipa-face';
    tel.innerHTML      = `<span class="sl">/</span>${escHtml(c.ipa)}<span class="sl">/</span>`;
    tel.style.fontSize = n >= 4 ? '3.4rem' : n === 3 ? '4.2rem' : '';
  } else {
    tel.className      = 'tel-char';
    tel.textContent    = c.ch;
    tel.style.fontSize = [...c.ch].length >= 3 ? '4.2rem' : '';   // wide conjunct (క్ష)
  }
  const badge = document.getElementById('cat-badge');
  badge.textContent  = c.cat;
  badge.style.visibility = document.getElementById('show-cat').checked ? '' : 'hidden';
  const rare = document.getElementById('rare-badge');
  rare.style.display = c.rare ? '' : 'none';
  const fb = document.getElementById('feedback');
  fb.textContent = '';
  fb.className   = 'feedback';
  document.getElementById('char-card').className = 'char-card';
}

/* ─────────────────────────────────────────────────────────
   PROGRESS BAR + COUNTERS
───────────────────────────────────────────────────────── */
function updateProg() {
  document.getElementById('s-rem').textContent   = deck.length;
  document.getElementById('s-done').textContent  = completed;
  document.getElementById('s-total').textContent = total;
  document.getElementById('prog-fill').style.width =
    (completed / total * 100).toFixed(1) + '%';
}

/* ─────────────────────────────────────────────────────────
   ANSWER HANDLER
───────────────────────────────────────────────────────── */
function onAnswer(letter, btn) {
  if (locked) return;
  locked = true;
  attempts++;

  const cur = deck[0];
  const ok  = (letter === cur);

  const card = document.getElementById('char-card');
  const fb   = document.getElementById('feedback');

  if (ok) {
    btn.classList.add('ok');
    card.classList.add('correct');
    fb.textContent = '✓  Correct!';
    fb.className   = 'feedback ok';

    deck.shift();
    completed++;
    updateProg();

    setTimeout(() => {
      btn.classList.remove('ok');
      if (deck.length === 0) showComplete();
      else { renderCard(); locked = false; }
    }, 500);

  } else {
    btn.classList.add('err');
    card.classList.add('wrong');
    if (reversed) {
      fb.textContent = `✗  ${cur.ch}`;
      fb.className   = 'feedback err te';
      Progress.miss({ game: GAME + '-reverse', key: cur.ch, prompt: `/${cur.ipa}/`, answer: cur.ch, note: cur.cat });
    } else {
      fb.textContent = `✗  /${cur.ipa}/`;
      fb.className   = 'feedback err';
      Progress.miss({ game: GAME, key: cur.ch, prompt: cur.ch, answer: `/${cur.ipa}/`, note: cur.cat });
    }

    // Highlight the correct key and scroll it into view (optional).
    // The answer text above is shown either way.
    const correctBtn = document.getElementById('highlight-correct').checked ? btnForLetter(cur) : null;
    if (correctBtn) {
      correctBtn.classList.add('ok');
      correctBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Reinsert the card at a random position (not immediately at front)
    const removed = deck.shift();
    const insertAt = Math.max(1, Math.floor(Math.random() * (deck.length + 1)));
    deck.splice(insertAt, 0, removed);

    setTimeout(() => {
      btn.classList.remove('err');
      if (correctBtn) correctBtn.classList.remove('ok');
      renderCard();
      locked = false;
    }, 850);
  }
}

/* ─────────────────────────────────────────────────────────
   COMPLETE SCREEN
───────────────────────────────────────────────────────── */
function showComplete() {
  document.getElementById('g-main').style.display = 'none';
  document.getElementById('g-complete').classList.add('show');

  document.getElementById('c-sub').textContent = reversed
    ? `All ${total} IPA phonemes correctly matched to their Telugu akshara.`
    : `All ${total} Telugu akshara correctly matched to their IPA phonemes.`;
  const errors = attempts - total;
  const acc    = Math.round(total / attempts * 100);
  document.getElementById('c-attempts').textContent = attempts;
  document.getElementById('c-accuracy').textContent = acc + '%';
  document.getElementById('c-errors').textContent   = errors;
  Progress.complete(GAME, { accuracy: acc, attempts });
}

/* ─────────────────────────────────────────────────────────
   INIT
───────────────────────────────────────────────────────── */
function initGame() {
  const pool = TeluguData.pool(CHARS, document.getElementById('include-extra').checked);
  deck      = shuffle(pool);
  total     = pool.length;
  completed = 0;
  attempts  = 0;
  locked    = false;

  document.getElementById('g-complete').classList.remove('show');
  document.getElementById('g-main').style.display = '';
  document.getElementById('kb-area').scrollTop = 0;

  buildKB(new Set(pool));
  updateProg();
  renderCard();
}

// 🔀 flips direction and starts a fresh round in the new direction
function setReversed(rev) {
  reversed = rev;
  const btn = document.getElementById('rev-btn');
  btn.setAttribute('aria-pressed', String(rev));
  btn.setAttribute('aria-label', rev ? 'Reverse direction: Telugu to IPA' : 'Reverse direction: IPA to Telugu');
  document.getElementById('g-title').textContent = rev ? 'IPA → Telugu' : 'Telugu → IPA';
  initGame();
}

document.getElementById('rev-btn').addEventListener('click', () => setReversed(!reversed));

document.getElementById('show-cat').addEventListener('change', e => {
  document.getElementById('cat-badge').style.visibility = e.target.checked ? '' : 'hidden';
});

document.getElementById('include-extra').addEventListener('change', initGame);

document.getElementById('retry-btn').addEventListener('click', initGame);
initGame();
</script>
</body>
</html>
