<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Diacritics</title>
  <link rel="stylesheet" href="../game.css">
  <style>
    /* ── Diacritics-specific (everything shared lives in game.css) ── */

    /* Syllable glyphs are wider than single letters */
    .tel-char { font-size: 4.6rem; margin-top: 22px; }   /* centers these glyphs like the other games */

    .slot { min-width: 120px; }

    /* (the keyboard, as the Telugu keyboard lays it out, is in game.css) */

    /* Reversed: bare vowel signs are small marks, so their keys print larger */
    .gkb .kb-btn.sign { font-size: 26px; }
    @media (max-width: 420px) { .gkb .kb-btn.sign { font-size: 22px; } }
    /* …but a whole syllable (కా, once the consonant is picked) is a letter's size */
    .gkb.syl .kb-btn.sign { font-size: 21px; }
    @media (max-width: 420px) { .gkb.syl .kb-btn.sign { font-size: 18px; } }

    /* Pending selection (before both pieces are chosen) */
    .kb-btn.sel:not(.ok):not(.err) {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent-light);
    }
  </style>
</head>
<body>
<div class="game-wrap">

  <!-- ── Progress header ── -->
  <header class="g-header">
    <div class="g-header-top">
      <div class="g-title-row">
        <span class="g-title" id="g-title">Diacritics → IPA</span>
      </div>
      <div class="g-right">
        <div class="g-stats">
          <span>Remaining&nbsp;<span class="g-stat-val" id="s-rem">0</span></span>
          <span>Correct&nbsp;<span class="g-stat-val" id="s-done">0</span>/<span class="g-stat-val" id="s-total">0</span></span>
          <span class="g-lives" id="s-lives" role="img"></span>
        </div>
      </div>
    </div>
    <div class="g-prog-track">
      <div class="g-prog-fill" id="prog-fill"></div>
    </div>
  </header>

  <!-- ── Game main ── -->
  <div class="g-main" id="g-main">
    <div class="card-area">
      <div class="char-card" id="char-card">
        <span class="cat-badge" id="cat-badge"></span>
        <span class="tel-char" id="tel-char"></span>
        <span class="rare-badge" id="rare-badge" style="display:none">rare</span>
      </div>
      <div class="slots">
        <div class="slot" id="slot-c">Consonant <span class="slot-val">–</span></div>
        <div class="slot" id="slot-v">Vowel <span class="slot-val">–</span></div>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="kb-area" id="kb-area"></div>
  </div>

  <!-- ── Complete screen (filled in by game-core.js) ── -->
  <div class="g-complete" id="g-complete"></div>

</div>

<script src="../settings.js"></script>
<script src="../telugu-data.js"></script>
<script src="../telugu-keyboard.js"></script>
<script src="../progress.js"></script>
<script src="../game-menu.js"></script>
<script src="../game-core.js"></script>
<script src="../game-setup.js"></script>
<script>
if (!window.TeluguData) throw new Error('../telugu-data.js was not found');
if (!window.GameCore)   throw new Error('../game-core.js was not found');
if (!window.GameSetup)  throw new Error('../game-setup.js was not found');
if (!window.TeluguKeyboard) throw new Error('../telugu-keyboard.js was not found');

/* ─────────────────────────────────────────────────────────
   DATA
   A card is one consonant + one vowel sign. To clear it the
   player picks BOTH the consonant phoneme and the vowel sound.
   Letters, signs, and flags come from telugu-data.js:
     rare    → "rare" badge
   The extra letters (ఱ, and the signs ౢ ౣ) are not practiced: they
   have a Reference page of their own (Bookish Telugu).

   The round itself (deck, counters, re-queuing a missed card,
   the complete screen, the record of each session) is game-core.js.
   The popup that opens first is game-setup.js. It holds every
   option: direction, number of rounds, game over, and
   the two checkboxes. There is no ⋮ menu on this page.
   This page draws the card, the keyboard, and the slots, and
   checks the pair of picks.
───────────────────────────────────────────────────────── */
const GAME       = 'diacritics';
const CONSONANTS = [...TeluguData.consonants, ...TeluguData.conjunctLetters];   // ends with క్ష
const VOWELS     = TeluguData.signs;
const N          = TeluguData.notation;   // how sounds are written: IPA (/kaː/) or ISO (kā), chosen on the home page
const { $, shuffle } = GameCore;

const PER_VOWEL = 3;     // cards per vowel sign (each with a different consonant)

/* ─────────────────────────────────────────────────────────
   STATE
───────────────────────────────────────────────────────── */
let reversed = false;             // false: card shows the syllable, keys show sounds
                                  // true:  card shows the sound, keys show Telugu
let sel = { c: null, v: null };   // pending picks: each key's ipa (its identity, whatever is printed on it)
let keys    = { c: [], v: [] };   // the consonants and vowel signs on the keyboard, in alphabet order
let kb      = null;               // the keyboard (telugu-keyboard.js board())
const SYLLABLES = TeluguKeyboard.syllables();   // "Keyboard shows syllables" (the app's settings)

/* ─────────────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────────────── */
// Grouped, each long vowel sits beside its short one: a ā · i ī · u ū · e ē · o ō, in one
// group, as the alphabet itself runs (అ ఆ ఇ ఈ …). telugu-data.js puts them in that order.
const { shortThenLong } = TeluguData;
const vowelBlock = v => (v.grp === 'Short' || v.grp === 'Long' ? 'Short · long' : v.grp);     // the group a vowel key is in

// Every vowel sign gets PER_VOWEL cards, each with a different random consonant
function buildDeck(cons, vows) {
  const cards = [];
  vows.forEach(v => {
    shuffle(cons).slice(0, PER_VOWEL).forEach(c => cards.push({
      c, v,
      glyph:    c.ch + v.sign,
      cat:      c.cat,
      rare:     c.rare || v.rare,
    }));
  });
  return cards;
}

// Vowel keys show the sign on its own, with no consonant (ా ి ీ … ం ః ్).
// The "no sign" key (the consonant's own short a) has nothing to draw, so it
// shows ◌, a placeholder meaning "nothing attached".
const NO_SIGN = '\u25CC';
const signLabel = v => v.sign === '' ? NO_SIGN : v.sign;

// A sound key: the consonant alone (k), or what the sign adds (aː · ā); ∅ for the pollu, which adds nothing
const soundLabel = (kind, it) => kind === 'c' ? N.part(it) : (N.sign(it) || '∅');

// What a pending pick looks like in its slot, in the current direction
function pickLabel(kind, ipa) {
  const it = (kind === 'c' ? CONSONANTS : VOWELS).find(x => x.ipa === ipa);
  if (!reversed) return soundLabel(kind, it);
  return kind === 'c' ? it.ch : signLabel(it);
}

function btnFor(kind, ipa) {
  return Array.from(document.querySelectorAll(`.kb-btn[data-kind="${kind}"]`))
    .find(b => b.dataset.ipa === ipa) || null;
}

/* ─────────────────────────────────────────────────────────
   BUILD THE KEYBOARD  (telugu-keyboard.js)
   One keyboard for both picks, as the Telugu keyboard lays it out:
   the vowels across the top, the consonants class by class below.
   A vowel key takes its vowel's place (ā at ఆ's, ṁ at ం's); a key
   with no place there is behind ౧౨౩: క్ష; and, keys showing sounds,
   the pure consonant ∅. Keys showing Telugu follow the Telugu
   keyboard after a consonant, where the అ key is ్: there ్ takes
   అ's place, and the "no sign" key ◌ is behind ౧౨౩.
   "Group keyboard phonetically": the vowel groups, then the
   consonant classes, each a labeled band.
   ⌫ takes back the consonant or vowel picked so far.
   With "Keyboard shows syllables" (the app's settings), once a
   consonant is picked the Telugu sign keys show the syllable
   each makes with it (కా కి … క్), as the Telugu keyboard does.
   Redrawing (when that box changes) never restarts the round.
───────────────────────────────────────────────────────── */
const vowelPlace = v => {
  if (v.sign === TeluguData.VIRAMA) return reversed ? 'అ' : null;               // ్
  if (v.sign === '') return reversed ? null : 'అ';                              // the consonant's own a
  if (v.sign === '\u0C02' || v.sign === '\u0C03') return v.sign;                 // ం ః
  const letter = TeluguData.vowels.find(l => l.ipa === v.ipa && l.ch.length === 1);
  return letter ? letter.ch : null;
};
function buildKB() {
  const pick = (kind, it) => (k, btn) => onPick(kind, it.ipa, btn);
  kb = TeluguKeyboard.board($('kb-area'), {
    grouped: GameMenu.grouped(),
    onBack:  onBack,
    faces:   reversed ? 'telugu' : 'sound',
    groups:  [...new Set(keys.v.map(vowelBlock)), ...new Set(keys.c.map(c => c.cat))],
    keys: [
      ...keys.v.map(it => ({
        te: vowelPlace(it), group: vowelBlock(it), vowel: true, telugu: reversed, cls: reversed ? 'sign' : '',
        label: reversed ? signLabel(it) : soundLabel('v', it),
        aria:  reversed ? (it.sign === '' ? 'no sign: the consonant on its own' : 'vowel sign ' + N.wrap(soundLabel('v', it))) : undefined,
        data:  { ipa: it.ipa, kind: 'v' }, onPick: pick('v', it),
      })),
      ...keys.c.map(it => ({
        te: it.ch, group: it.cat, telugu: reversed,
        label: reversed ? it.ch : soundLabel('c', it),
        data:  { ipa: it.ipa, kind: 'c' }, onPick: pick('c', it),
      })),
    ],
  });

  // keep a half-made answer visible across a redraw
  if (!game.locked) ['c', 'v'].forEach(k => {
    const b = sel[k] !== null && btnFor(k, sel[k]);
    if (b) b.classList.add('sel');
  });
  showSyllables();
}

// The sign keys once a consonant is picked: each the syllable it makes (కా), or the bare sign
function showSyllables() {
  if (!kb) return;
  const c = reversed && SYLLABLES && sel.c !== null && sel.v === null && CONSONANTS.find(x => x.ipa === sel.c);   // not once answered
  kb.relabel(c ? k => (k.data.kind === 'v' ? c.ch + VOWELS.find(v => v.ipa === k.data.ipa).sign : null) : null);
  kb.el.classList.toggle('syl', !!c);
  kb.back(!game.locked && (sel.c !== null) !== (sel.v !== null));      // one of the two picked
}

const IPA_SIZE = ['', '5rem', '5rem', '4.2rem', '3.6rem', '3.1rem', '2.7rem'];   // by length of the sound; the last applies to anything longer


/* ─────────────────────────────────────────────────────────
   ROUND STATE + RENDER
───────────────────────────────────────────────────────── */
function updateSlots() {
  [['c', 'slot-c'], ['v', 'slot-v']].forEach(([k, id]) => {
    const slot = $(id);
    const has  = sel[k] !== null;
    slot.classList.toggle('filled', has);
    const val = slot.querySelector('.slot-val');
    val.textContent = has ? pickLabel(k, sel[k]) : '–';
    val.classList.toggle('te', reversed && has);
  });
  showSyllables();
}

function clearRound() {
  sel = { c: null, v: null };
  document.querySelectorAll('.kb-btn').forEach(b => b.classList.remove('sel', 'ok', 'err'));
  ['slot-c', 'slot-v'].forEach(id => $(id).classList.remove('ok', 'err'));
  updateSlots();
}

function renderCard(c) {
  const tel = $('tel-char');
  if (reversed) {
    // the sound, /kaː/ or kā; longer strings (kʰaː, tʃʰai, khai) step down a size
    const sound = N.syllable(c.c, c.v), n = [...sound].length;
    tel.className      = 'tel-char ipa-face';
    tel.innerHTML      = N.html(sound);
    tel.style.fontSize = IPA_SIZE[Math.min(n, IPA_SIZE.length - 1)];
  } else {
    tel.className      = 'tel-char';
    tel.textContent    = c.glyph;
    tel.style.fontSize = '';
  }

  const badge = $('cat-badge');
  badge.textContent      = `${c.cat} + ${c.v.grp}`;        // the consonant's category and the vowel's: "Velar + Short"
  GameMenu.sync();                                         // the label shows while the keyboard is grouped
  $('rare-badge').style.display = c.rare ? '' : 'none';
  clearRound();
}

/* ─────────────────────────────────────────────────────────
   ANSWER HANDLING
   Picking one piece only marks it; the round is judged as
   soon as BOTH a consonant and a vowel have been chosen.
   ⌫ takes back the piece picked so far.
───────────────────────────────────────────────────────── */
function onPick(kind, ipa, btn) {
  if (game.locked) return;
  sel[kind] = ipa;
  document.querySelectorAll(`.kb-btn[data-kind="${kind}"]`)
    .forEach(b => b.classList.toggle('sel', b === btn));
  updateSlots();
  if (sel.c !== null && sel.v !== null) evaluate();
}

// ⌫: take back the one piece picked so far
function onBack() {
  if (game.locked) return;
  ['c', 'v'].forEach(k => {
    if (sel[k] === null) return;
    const b = btnFor(k, sel[k]);
    if (b) b.classList.remove('sel');
    sel[k] = null;
  });
  updateSlots();
}

function evaluate() {
  const cur    = game.current;
  const answer = { c: cur.c.ipa, v: cur.v.ipa };
  const allOk  = sel.c === answer.c && sel.v === answer.v;
  let scrollTarget = null;

  ['c', 'v'].forEach(k => {
    const good   = sel[k] === answer[k];
    const picked = btnFor(k, sel[k]);
    picked.classList.remove('sel');
    picked.classList.add(good ? 'ok' : 'err');
    $(k === 'c' ? 'slot-c' : 'slot-v').classList.add(good ? 'ok' : 'err');

    if (!good) {
      const right = btnFor(k, answer[k]);
      if (right) {
        right.classList.add('ok');
        TeluguKeyboard.reveal(right);    // it may be behind ౧౨౩
        scrollTarget = scrollTarget || right;
      }
    }
  });
  if (scrollTarget) scrollTarget.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // The line under the card says what was picked: the syllable the two picks make
  // (its sound, or reversed the syllable itself). It never gives the answer;
  // the keys that should have been pressed are lit on the keyboard.
  const pc = CONSONANTS.find(x => x.ipa === sel.c), pv = VOWELS.find(x => x.ipa === sel.v);
  game.judge(allOk, {
    feedback: `${allOk ? '✓' : '✗'}  ${reversed ? pc.ch + pv.sign : N.wrap(N.syllable(pc, pv))}`,
    te:       reversed,
    miss:     reversed
      ? { game: GAME + '-reverse', key: cur.glyph, ask: 'sound',  syllable: true, note: cur.v.grp }
      : { game: GAME,              key: cur.glyph, ask: 'telugu', syllable: true, note: cur.v.grp },
  });
}

/* ─────────────────────────────────────────────────────────
   THE ROUND  (game-core.js)
───────────────────────────────────────────────────────── */
// What a new round is dealt from: the book's consonants and signs.
// The keyboard carries all of them, however few rounds are dealt.
const inPlay = () => ({ c: TeluguData.pool(CONSONANTS, false), v: shortThenLong(TeluguData.pool(VOWELS, false)) });
function deal() {
  keys = inPlay();
  return buildDeck(keys.c, keys.v);
}
// How many cards that is: PER_VOWEL for every sign (51)
const deckSize = () => { const k = inPlay(); return k.v.length * Math.min(PER_VOWEL, k.c.length); };

const game = GameCore.create({
  id:   GAME,
  errMs: 1500,                           // a wrong pick stays on screen for a second and a half
  pool: deal,
  onRetry: () => openSetup(),            // "Practice Again" asks how to play the next session
  variant: () => (reversed ? 'reverse' : ''),   // kept with each session's result (the Profile page)
  onStart() {
    $('kb-area').scrollTop = 0;
    buildKB();
  },
  render:   renderCard,
  doneText: g => reversed
    ? `All ${g.total} sounds correctly written as Telugu syllables.`
    : `All ${g.total} syllables correctly matched to their ${N.id === 'iso' ? 'ISO spellings' : 'IPA sounds'}.`,
});

// The two ways around, in the reader's notation. The title says which one is being played.
const DIRECTIONS = [`Diacritics → ${N.name}`, `${N.name} → Diacritics`];
function showDirection() { $('g-title').textContent = DIRECTIONS[reversed ? 1 : 0]; }

/* ─────────────────────────────────────────────────────────
   SESSION SETUP  (game-setup.js)
   The popup that opens with the page, and again from
   "Practice Again". Every option is in it; the checkboxes
   keep the ids this page reads them by. Start deals a new
   session with what it shows.
───────────────────────────────────────────────────────── */
const setup = GameSetup.create({
  title:     'Diacritics',
  home:      '../index.html',
  direction: DIRECTIONS,
  options: [
    { id: 'group-kb',      label: 'Group keyboard phonetically' },
    { id: 'missed-again',  label: 'Missed guesses reappear', checked: true },
  ],
  max: deckSize,
  onStart(v) {
    reversed = v.reversed;
    showDirection();
    game.start({ size: v.rounds, misses: v.misses, again: $('missed-again').checked });
  },
});
// leave: Cancel goes back to Home (only when the page has just opened and nothing was played)
const openSetup = (leave = false) => setup.open({ leave });

/* ── The keyboard option ──────────────────────────────── */
// game-menu.js redraws the keyboard (and shows or hides the card's groups) when "Group keyboard
// phonetically" changes. It finds the box by id, which is why the popup is created above this
// line. This page has no ⋮ menu for it to open.
GameMenu.init({ rebuild: buildKB });

showDirection();
game.start();                            // a round is dealt behind the popup; Start deals the one that is played
openSetup(true);
</script>
</body>
</html>
