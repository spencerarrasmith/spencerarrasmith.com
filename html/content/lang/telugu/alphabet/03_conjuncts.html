<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Conjuncts</title>
  <link rel="stylesheet" href="../game.css">
  <style>
    /* ── Conjunct-specific (everything shared lives in game.css) ── */

    /* Conjunct glyphs stack vertically and run wide */
    .tel-char { font-size: 4.4rem; margin-top: 4px; }    /* these glyphs sit low in the line box; centers them like the other games */

    /* Instruction line shown until the round is answered */
    .feedback.hint {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 400;
    }
    /* Keys showing the conjunct in the making (క్క క్ఖ …): taller than a letter */
    .gkb.joining .kb-btn.te { font-size: 17px; }
    @media (max-width: 420px) { .gkb.joining .kb-btn.te { font-size: 14px; } }
  </style>
</head>
<body>
<div class="game-wrap">

  <!-- ── Progress header ── -->
  <header class="g-header">
    <div class="g-header-top">
      <div class="g-title-row">
        <span class="g-title" id="g-title">Conjuncts → IPA</span>
      </div>
      <div class="g-right">
        <div class="g-stats">
          <span>Remaining&nbsp;<span class="g-stat-val" id="s-rem">0</span></span>
          <span>Correct&nbsp;<span class="g-stat-val" id="s-done">0</span>/<span class="g-stat-val" id="s-total">0</span></span>
          <span class="g-lives" id="s-lives" role="img"></span>
        </div>
      </div>
    </div>
    <div class="g-prog-track">
      <div class="g-prog-fill" id="prog-fill"></div>
    </div>
  </header>

  <!-- ── Game main ── -->
  <div class="g-main" id="g-main">
    <div class="card-area">
      <div class="char-card" id="char-card">
        <span class="cat-badge" id="cat-badge"></span>
        <span class="tel-char" id="tel-char"></span>
        <span class="rare-badge" id="rare-badge" style="display:none">rare</span>
      </div>
      <div class="slots" id="slots"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="kb-area" id="kb-area"></div>
  </div>

  <!-- ── Complete screen (filled in by game-core.js) ── -->
  <div class="g-complete" id="g-complete"></div>

</div>

<script src="../settings.js"></script>
<script src="../telugu-data.js"></script>
<script src="../telugu-keyboard.js"></script>
<script src="../progress.js"></script>
<script src="../game-menu.js"></script>
<script src="../game-core.js"></script>
<script src="../game-setup.js"></script>
<script>
if (!window.TeluguData) throw new Error('../telugu-data.js was not found');
if (!window.GameCore)   throw new Error('../game-core.js was not found');
if (!window.GameSetup)  throw new Error('../game-setup.js was not found');

/* ─────────────────────────────────────────────────────────
   DATA
   A conjunct is 2–3 consonants joined by a virama (్). The
   vowel is always the inherent short "a". To clear a card the
   player picks EVERY consonant, in order.
   The consonants, the cluster list (CLUSTER_SETS) and the
   flags all live in telugu-data.js — edit clusters there.
     classes → the card's label: each consonant's class, in
               order ("Nasal + Velar"). Never the set name,
               which can name a letter ("+ య (ya)")
     rare    → "rare" badge (clusters marked * in the list)
     core    → false for rare clusters: dealt only when
               "Include uncommon clusters" is checked
   The extra letters (ఱ ౘ ౙ) are not practiced: they have a
   Reference page of their own (Bookish Telugu).

   The round itself (deck, counters, re-queuing a missed card,
   the complete screen, the record of each session) is game-core.js.
   The popup that opens first is game-setup.js. It holds every
   option: direction, number of rounds, game over, and
   the three checkboxes. There is no ⋮ menu on this page.
   This page draws the card, the keyboard, and the slots, and
   checks the picks.
───────────────────────────────────────────────────────── */
const GAME       = 'conjuncts';             // tile id: finishing either direction checks off the tile
const CONSONANTS = TeluguData.consonants;
const CLUSTERS   = TeluguData.clusters;
const N          = TeluguData.notation;     // how sounds are written: IPA (/kʂa/) or ISO (kṣa), chosen on the home page
const { $ } = GameCore;

const SESSION_SIZE = 40;    // cards in the usual session, sampled from the pool (the popup can ask for fewer, or more)
const ORDINALS     = ['1st', '2nd', '3rd', '4th'];
const HINT         = 'Pick each consonant in order · the vowel is always the short “a”';
const IPA_SIZE     = ['', '5rem', '5rem', '4.2rem', '3.6rem', '3.1rem', '2.7rem'];   // by length of the sound; the last applies to anything longer

/* ─────────────────────────────────────────────────────────
   STATE
───────────────────────────────────────────────────────── */
let reversed = false;   // false: card shows the conjunct, keys show sounds
                        // true:  card shows the sound, keys show Telugu letters
let sel = [];        // picked ipa per slot (null = empty): a key's identity, whatever is printed on it
let slotEls = [];
let keys    = [];    // the consonants on the keyboard, in alphabet order
let kb      = null;  // the keyboard (telugu-keyboard.js board())
const SYLLABLES = TeluguKeyboard.syllables();   // "Keyboard shows syllables" (the app's settings)

/* ─────────────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────────────── */
function btnFor(ipa) {
  return Array.from(document.querySelectorAll('.kb-btn'))
    .find(b => b.dataset.ipa === ipa) || null;
}

/* ─────────────────────────────────────────────────────────
   BUILD KEYBOARD  (consonants only; telugu-keyboard.js)
   Sound keys (each consonant alone: k), or (reversed) the Telugu
   letters. "Group keyboard phonetically" unchecked: the whole Telugu
   keyboard, each consonant where it sits (ఞ behind ౧౨౩), the vowels
   there too but dimmed: no conjunct asks for one. Checked: in
   groups by place of articulation. Redrawing (when that box
   changes) never restarts the round.
   ⌫ takes back the last pick: on once a consonant is picked,
   until the last slot is filled.
   With "Keyboard shows syllables" (the app's settings), Telugu
   keys show the conjunct in the making: once the 1st consonant
   is స, they read స్క స్ఖ …, as the Telugu keyboard does after
   స్. Sound keys stay sounds.
───────────────────────────────────────────────────────── */
function buildKB() {
  kb = TeluguKeyboard.board($('kb-area'), {
    grouped: GameMenu.grouped(),
    onBack:  onBack,
    faces:   reversed ? 'telugu' : 'sound',
    keys: keys.map(it => ({
      te: it.ch, group: it.cat, telugu: reversed,
      label: reversed ? it.ch : N.part(it),
      data:  { ipa: it.ipa, ch: it.ch },
      onPick: () => onPick(it.ipa),
    })),
  });
  showJoins();
}

// The keys after the picks so far: each the conjunct it would make (స్క), or its own letter
function showJoins() {
  if (!kb) return;
  const next = sel.indexOf(null);
  const so = reversed && SYLLABLES && !game.locked && next > 0
    ? sel.slice(0, next).map(ipa => CONSONANTS.find(c => c.ipa === ipa).ch).join(TeluguData.VIRAMA) + TeluguData.VIRAMA
    : '';
  kb.relabel(so ? k => so + k.data.ch : null);
  kb.el.classList.toggle('joining', !!so);
  kb.back(!game.locked && sel.some(s => s !== null) && sel.includes(null));   // a conjunct half made
}

/* ─────────────────────────────────────────────────────────
   SLOTS + RENDER
───────────────────────────────────────────────────────── */
function buildSlots(n) {
  const box = $('slots');
  box.innerHTML = '';
  slotEls = [];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('button');
    s.type      = 'button';
    s.className = 'slot';
    s.title     = 'Tap to clear';
    s.innerHTML = `${ORDINALS[i]} <span class="slot-val">–</span>`;
    s.addEventListener('click', () => onSlot(i));
    box.appendChild(s);
    slotEls.push(s);
  }
}

function updateSlots() {
  slotEls.forEach((el, i) => {
    const has = sel[i] !== null;
    el.classList.toggle('filled', has);
    const val = el.querySelector('.slot-val');
    const picked = has && CONSONANTS.find(c => c.ipa === sel[i]);
    val.textContent = !has ? '–' : reversed ? picked.ch : N.part(picked);
    val.classList.toggle('te', reversed && has);
  });
  showJoins();
}

// "usually said /ɡɲa/" for the few clusters spoken differently from their letters.
// This is about the sound, so it stays in IPA whichever notation the card uses.
const spokenNote = c => c.spoken ? `  ·  usually said /${c.spoken}/` : '';

function renderCard(c) {
  const tel = $('tel-char');
  if (reversed) {
    // the conjunct as written, /kʂa/ or kṣa; longer strings (ʂʈra, tʃtʃʰa) step down a size
    const sound = N.cluster(c), n = [...sound].length;
    tel.className      = 'tel-char ipa-face';
    tel.innerHTML      = N.html(sound);
    tel.style.fontSize = IPA_SIZE[Math.min(n, IPA_SIZE.length - 1)];
  } else {
    tel.className      = 'tel-char';
    tel.textContent    = c.glyph;
    tel.style.fontSize = '';
  }

  const badge = $('cat-badge');
  badge.textContent      = c.classes;
  GameMenu.sync();                                         // the label shows while the keyboard is grouped
  $('rare-badge').style.display = (c.rare || !c.inBook) ? '' : 'none';

  document.querySelectorAll('.kb-btn').forEach(b => b.classList.remove('ok', 'err'));
  sel = c.parts.map(() => null);
  buildSlots(c.parts.length);
  showJoins();

  // Until the card is answered, the line under it carries the instruction
  const fb = $('feedback');
  fb.textContent = !c.spoken ? HINT
    : reversed ? `This is the ${N.id === 'iso' ? 'spelling' : 'sound'} as written · spoken Telugu usually says /${c.spoken}/`
               : `Pick the letters as written · spoken Telugu usually says /${c.spoken}/`;
  fb.className   = 'feedback hint';
}

/* ─────────────────────────────────────────────────────────
   ANSWER HANDLING
   Each pick fills the next empty slot (the same key can be
   used twice for doubled letters). The round is judged as
   soon as every slot is filled; tap a filled slot to clear it,
   or ⌫ to clear the last one.
───────────────────────────────────────────────────────── */
function onPick(ipa) {
  if (game.locked) return;
  const i = sel.indexOf(null);
  if (i === -1) return;
  sel[i] = ipa;
  updateSlots();
  if (!sel.includes(null)) evaluate();
}

// ⌫: clear the last filled slot
function onBack() {
  if (game.locked) return;
  for (let i = sel.length - 1; i >= 0; i--) if (sel[i] !== null) return onSlot(i);
}

function onSlot(i) {
  if (game.locked || sel[i] === null) return;
  sel[i] = null;
  updateSlots();
}

function evaluate() {
  const cur     = game.current;
  const answer  = cur.parts.map(p => p.ipa);
  const results = sel.map((s, i) => s === answer[i]);
  const allOk   = results.every(Boolean);

  slotEls.forEach((el, i) => el.classList.add(results[i] ? 'ok' : 'err'));

  // Wrong picks red (unless that key is a correct answer elsewhere), answers green
  const answerSet = new Set(answer);
  sel.forEach((s, i) => {
    if (!results[i] && !answerSet.has(s)) btnFor(s).classList.add('err');
  });
  answerSet.forEach(a => btnFor(a).classList.add('ok'));
  if (!allOk) {
    const firstMiss = answer.findIndex((a, i) => !results[i]);
    const right = btnFor(answer[firstMiss]);
    TeluguKeyboard.reveal(right);        // it may be behind ౧౨౩
    right.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // The line under the card says what was picked: the conjunct the picks make, spelled the
  // way the data spells one (its sound, or reversed the letters joined by ్). It never gives
  // the answer; the keys that should have been pressed are lit on the keyboard.
  // A right answer keeps the note on how the conjunct is usually said.
  const picks  = sel.map(s => CONSONANTS.find(c => c.ipa === s));
  const picked = reversed ? picks.map(p => p.ch).join(TeluguData.VIRAMA) : N.wrap(picks.map(N.part).join('') + N.inherent);
  game.judge(allOk, {
    feedback: `${allOk ? '✓' : '✗'}  ${picked}${allOk ? spokenNote(cur) : ''}`,
    te:       reversed,
    miss:     reversed
      ? { game: GAME + '-reverse', key: cur.glyph, ask: 'sound',  syllable: true, note: cur.classes }
      : { game: GAME,              key: cur.glyph, ask: 'telugu', syllable: true, note: cur.classes },
  });
}

/* ─────────────────────────────────────────────────────────
   THE ROUND  (game-core.js)
───────────────────────────────────────────────────────── */
const pool = () => TeluguData.pool(CLUSTERS, $('include-uncommon').checked).filter(c => c.inBook);   // 83 clusters, or all 92
const game = GameCore.create({
  id:   GAME,
  size: SESSION_SIZE,
  errMs: 1500,                           // a wrong pick stays on screen for a second and a half
  pool,
  onRetry: () => openSetup(),            // "Practice Again" asks how to play the next session
  variant: () => (reversed ? 'reverse' : ''),   // kept with each session's result (the Profile page)
  onStart() {
    $('kb-area').scrollTop = 0;
    keys = TeluguData.pool(CONSONANTS, false);   // the book's consonants (ఙ ఞ among them, for the uncommon clusters)
    buildKB();
  },
  render:   renderCard,
  doneText: g => reversed
    ? `All ${g.total} sounds correctly written as Telugu conjuncts.`
    : `All ${g.total} conjuncts correctly matched to their consonants.`,
});

// The two ways around, in the reader's notation. The title says which one is being played.
const DIRECTIONS = [`Conjuncts → ${N.name}`, `${N.name} → Conjuncts`];
function showDirection() { $('g-title').textContent = DIRECTIONS[reversed ? 1 : 0]; }

/* ─────────────────────────────────────────────────────────
   SESSION SETUP  (game-setup.js)
   The popup that opens with the page, and again from
   "Practice Again". Every option is in it; the checkboxes
   keep the ids this page reads them by. Start deals a new
   session with what it shows.
   The rounds slider starts at the usual 40 and runs up to
   every cluster in play.
───────────────────────────────────────────────────────── */
const setup = GameSetup.create({
  title:     'Conjuncts',
  home:      '../index.html',
  direction: DIRECTIONS,
  options: [
    { id: 'group-kb',         label: 'Group keyboard phonetically' },
    { id: 'include-uncommon', label: 'Include uncommon clusters' },
    { id: 'missed-again',     label: 'Missed guesses reappear', checked: true },
  ],
  max:    () => pool().length,
  rounds: () => SESSION_SIZE,
  onStart(v) {
    reversed = v.reversed;
    showDirection();
    // rounds: null is the slider at its top end, which here is every cluster and not the usual 40
    game.start({ size: v.rounds === null ? pool().length : v.rounds, misses: v.misses, again: $('missed-again').checked });
  },
});
// leave: Cancel goes back to Home (only when the page has just opened and nothing was played)
const openSetup = (leave = false) => setup.open({ leave });

/* ── The keyboard option ──────────────────────────────── */
// game-menu.js redraws the keyboard (and shows or hides the card's classes) when "Group keyboard
// phonetically" changes. It finds the box by id, which is why the popup is created above this
// line. This page has no ⋮ menu for it to open.
GameMenu.init({ rebuild: buildKB });

showDirection();
game.start();                            // a round is dealt behind the popup; Start deals the one that is played
openSetup(true);
</script>
</body>
</html>
