<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lookalikes</title>
  <link rel="stylesheet" href="../game.css">
  <style>
    /* ── Lookalikes-specific (everything shared lives in game.css) ── */

    /* The choices: big Telugu keys, one block per card */
    .kb-btn.choice {
      min-width: 72px;
      padding: 6px 18px;
      font-size: 34px;
      line-height: 1.35;
    }
    .kb-btn.choice.long { font-size: 28px; }      /* syllables and conjuncts run wider */

    /* Lookalike sets, inside the ⋮ menu */
    .menu-sep { height: 1px; margin: 5px 4px; background: var(--border); }
    .menu-head {
      padding: 6px 10px 2px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .menu-act {
      display: flex;
      gap: 8px;
      padding: 4px 10px 6px;
    }
    .menu-act button {
      flex: 1;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .menu-act button:hover { border-color: var(--accent); background: var(--accent-glow); }
    .menu-act button:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }
    .menu-status { padding: 0 10px 6px; max-width: 280px; font-size: 11px; line-height: 1.4; color: var(--text-muted); }
    .menu-status.err { color: var(--error); }

    /* Nothing to practice */
    .empty-note { max-width: 320px; text-align: center; font-size: 13px; line-height: 1.5; color: var(--text-muted); }
  </style>
</head>
<body>
<div class="game-wrap">

  <!-- ── Progress header ── -->
  <header class="g-header">
    <div class="g-header-top">
      <span class="g-title">Lookalikes</span>
      <div class="g-right">
        <div class="g-stats">
          <span>Remaining&nbsp;<span class="g-stat-val" id="s-rem">0</span></span>
          <span>Correct&nbsp;<span class="g-stat-val" id="s-done">0</span>/<span class="g-stat-val" id="s-total">0</span></span>
        </div>
        <div class="menu-wrap" id="menu-wrap">
          <button class="menu-btn" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false"
                  aria-controls="opts-menu" aria-label="Options" title="Options">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="2.8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="8" cy="13.2" r="1.6"/></svg>
          </button>
          <div class="menu" id="opts-menu" role="group" aria-label="Options" hidden>
            <label class="menu-opt"><input type="checkbox" id="shuffle-kb" checked> <span>Shuffle choices</span></label>
            <label class="menu-opt"><input type="checkbox" id="include-extra"> <span>Include extra letters</span></label>
            <div class="menu-sep"></div>
            <div class="menu-head">Lookalike sets</div>
            <label class="menu-opt"><input type="checkbox" id="use-builtin" checked> <span>Built-in groups</span></label>
            <label class="menu-opt" id="custom-row"><input type="checkbox" id="use-custom" disabled> <span class="menu-txt"><span>My CSV groups</span><span class="menu-note" id="custom-note">None uploaded yet</span></span></label>
            <div class="menu-act">
              <button type="button" id="csv-btn">Upload CSV…</button>
              <button type="button" id="csv-clear" hidden>Remove mine</button>
            </div>
            <input type="file" id="csv-file" accept=".csv,.txt,text/csv,text/plain" hidden>
            <div class="menu-status" id="csv-status" role="status">One group per row, characters separated by commas. Make one with the Lookalike Builder.</div>
          </div>
        </div>
      </div>
    </div>
    <div class="g-prog-track">
      <div class="g-prog-fill" id="prog-fill"></div>
    </div>
  </header>

  <!-- ── Game main ── -->
  <div class="g-main" id="g-main">
    <div class="card-area">
      <div class="char-card" id="char-card">
        <span class="cat-badge" id="cat-badge"></span>
        <span class="tel-char ipa-face" id="tel-char"></span>
        <span class="rare-badge" id="rare-badge" style="display:none">rare</span>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="kb-area" id="kb-area"></div>
  </div>

  <!-- ── Complete screen (filled in by game-core.js) ── -->
  <div class="g-complete" id="g-complete"></div>

</div>

<script src="../settings.js"></script>
<script src="../telugu-data.js"></script>
<script src="../lookalikes-data.js"></script>
<script src="../progress.js"></script>
<script src="../game-menu.js"></script>
<script src="../game-core.js"></script>
<script>
if (!window.TeluguData)    throw new Error('../telugu-data.js was not found');
if (!window.LookalikeData) throw new Error('../lookalikes-data.js was not found');
if (!window.GameCore)      throw new Error('../game-core.js was not found');

/* ─────────────────────────────────────────────────────────
   DATA
   A card shows one sound; the answer is the one Telugu character,
   out of ALL the characters in its lookalike group, that makes it.
     built-in groups   lookalikes-data.js (edit GROUPS there)
     your groups       a CSV from the Lookalike Builder, uploaded
                       from the ⋮ menu and kept in this browser
   Every character in a group becomes a card, each with its whole
   group as the choices (a character in two groups gets two cards).
   Items carry rare / core flags from telugu-data.js: rare shows the
   "rare" pip; extras (ఱ ఌ ౡ …) wait for "Include extra letters".

   The round itself (deck, counters, re-queueing a missed card,
   the complete screen, the ✓ on the home tile) is game-core.js.
   This page draws the card and its choices, checks the pick,
   and looks after your CSV.
───────────────────────────────────────────────────────── */
const GAME     = 'lookalikes';
const N = TeluguData.notation;           // how the sound on the card is written: IPA (/k/) or ISO (ka), chosen on the home page
const { $, shuffle } = GameCore;
const BUILTIN  = LookalikeData.groups;
const STORE    = 'telugu-lookalikes-csv';     // the raw text of the uploaded file

const SESSION_SIZE = 40;    // cards per session, sampled from the pool
const IPA_SIZE     = ['', '5rem', '5rem', '4.2rem', '3.6rem', '3.1rem', '2.7rem'];   // by length of the sound; the last applies to anything longer

/* ─────────────────────────────────────────────────────────
   STATE
───────────────────────────────────────────────────────── */
let custom = [];         // groups parsed from the uploaded CSV
let order  = [];         // the current card's choices, as drawn
let marks  = new Map();  // text → 'ok' | 'err' once the card is answered

/* ─────────────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────────────── */
// One card per character of every group in the ticked sets. A group that
// shrinks below two characters (extras hidden) has nothing to tell apart.
function buildCards(sources, includeExtra) {
  const cards = [];
  sources.forEach(groups => groups.forEach(g => {
    const items = g.items.filter(i => includeExtra || i.core);
    if (items.length < 2) return;
    items.forEach(item => cards.push({ item, options: items }));
  }));
  return cards;
}

/* ─────────────────────────────────────────────────────────
   YOUR CSV  (upload, remember, remove)
───────────────────────────────────────────────────────── */
function say(msg, isErr) {
  const s = $('csv-status');
  s.textContent = msg;
  s.classList.toggle('err', !!isErr);
}

function syncSets() {
  const has = custom.length > 0;
  $('use-custom').disabled = !has;
  if (!has) $('use-custom').checked = false;
  $('csv-clear').hidden = !has;
  $('custom-row').classList.toggle('disabled', !has);
  const n = custom.reduce((s, g) => s + g.items.length, 0);
  $('custom-note').textContent = has
    ? `${custom.length} group${custom.length === 1 ? '' : 's'} · ${n} characters`
    : 'None uploaded yet';
}

function loadSaved() {
  let text = null;
  try { text = localStorage.getItem(STORE); } catch (e) {}
  if (!text) return;
  custom = LookalikeData.parseCsv(text).groups;
  if (custom.length) $('use-custom').checked = true;
}

function onFile(file) {
  const reader = new FileReader();
  reader.onerror = () => say('That file could not be read. Choose a .csv saved as UTF-8.', true);
  reader.onload  = () => {
    const text = String(reader.result);
    const r = LookalikeData.parseCsv(text);
    if (!r.groups.length) {
      say(`No lookalike groups found in ${file.name}. Each row needs two or more Telugu characters separated by commas.`, true);
      return;
    }
    custom = r.groups;
    try { localStorage.setItem(STORE, text); } catch (e) {}
    syncSets();
    $('use-custom').checked  = true;
    $('use-builtin').checked = false;            // your own set replaces the baseline until you tick it again
    say(`Loaded ${custom.length} group${custom.length === 1 ? '' : 's'} from ${file.name}. Built-in groups are switched off; tick them to practice both.` +
        (r.skipped.length ? ` Skipped ${r.skipped.length} I can't give a sound for: ${r.skipped.slice(0, 8).join(' ')}${r.skipped.length > 8 ? ' …' : ''}` : ''));
    game.start();
  };
  reader.readAsText(file);
}

function clearCsv() {
  custom = [];
  try { localStorage.removeItem(STORE); } catch (e) {}
  $('use-builtin').checked = true;
  syncSets();
  say('Removed your CSV. Back to the built-in groups.');
  game.start();
}

/* ─────────────────────────────────────────────────────────
   CHOICES
───────────────────────────────────────────────────────── */
const orderFor = card => GameMenu.shuffled() ? shuffle(card.options) : card.options;

// Follows the options menu: "Shuffle choices" ticked → a random order that
// stays fixed for the card, so keys can be found. Rebuilding (e.g. when an
// option changes) never restarts the round.
function buildKB() {
  const area = $('kb-area');
  area.innerHTML = '';
  if (!game.current) return;
  const g = document.createElement('div');
  g.className = 'kb-group';
  const l = document.createElement('div');
  l.className   = 'kb-label';
  l.textContent = N.id === 'iso' ? 'Which one is spelled this way?' : 'Which one makes this sound?';
  g.appendChild(l);
  const row = document.createElement('div');
  row.className = 'kb-row';
  order.forEach(it => {
    const btn = document.createElement('button');
    btn.className   = 'kb-btn te choice' + ([...it.text].length > 1 ? ' long' : '');
    btn.textContent = it.text;
    btn.dataset.text = it.text;
    if (marks.has(it.text)) btn.classList.add(marks.get(it.text));
    btn.addEventListener('click', () => onPick(it));
    row.appendChild(btn);
  });
  g.appendChild(row);
  area.appendChild(g);
}

/* ─────────────────────────────────────────────────────────
   RENDER
───────────────────────────────────────────────────────── */
function renderCard(c) {
  const sound = N.of(c.item), n = [...sound].length;
  const tel = $('tel-char');
  tel.className      = 'tel-char ipa-face';
  tel.innerHTML      = N.html(sound);
  tel.style.fontSize = IPA_SIZE[Math.min(n, IPA_SIZE.length - 1)];

  $('cat-badge').textContent    = `${c.options.length} lookalikes`;
  $('rare-badge').style.display = (c.item.rare || !c.item.core) ? '' : 'none';

  marks = new Map();
  order = orderFor(c);
  buildKB();
}

/* ─────────────────────────────────────────────────────────
   ANSWER HANDLING
   One tap judges the card. Characters that make the same sound
   all count (a letter and the same letter with a virama, say).
───────────────────────────────────────────────────────── */
function onPick(it) {
  if (game.locked) return;
  const cur = game.current;
  // Right = written the way the card is. In IPA క and క్ are both /k/, so either counts;
  // in ISO they are ka and k, so only the one on the card does.
  const same = o => N.of(o) === N.of(cur.item);
  const ok   = same(it);

  cur.options.forEach(o => { if (same(o)) marks.set(o.text, 'ok'); });
  if (!ok) marks.set(it.text, 'err');
  buildKB();

  game.judge(ok, {
    feedback: `${ok ? '✓' : '✗'}  ${cur.item.text}`,
    te:       true,
    miss:     { key: cur.item.text, ask: 'sound',
                note: 'Among ' + cur.options.map(o => o.text).join(' ') },
  });
}

/* ─────────────────────────────────────────────────────────
   THE ROUND  (game-core.js)
───────────────────────────────────────────────────────── */
// The cards of the ticked sets, with the options applied.
function deal() {
  const sources = [];
  if ($('use-builtin').checked) sources.push(BUILTIN);
  if ($('use-custom').checked && custom.length) sources.push(custom);
  return buildCards(sources, $('include-extra').checked);
}

// Every group emptied by the options: nothing to play, so say what to change.
function showEmpty() {
  order = [];
  $('tel-char').innerHTML = '';
  $('cat-badge').textContent = '';
  $('rare-badge').style.display = 'none';
  $('char-card').className = 'char-card';
  $('feedback').textContent = '';
  $('kb-area').innerHTML = '<p class="empty-note">No lookalike groups to practice with these options. Tick a set, or “Include extra letters”, in the ⋮ menu.</p>';
}

const game = GameCore.create({
  id:   GAME,
  size: SESSION_SIZE,
  pool: deal,
  onStart() {
    marks = new Map();
    $('kb-area').scrollTop = 0;
  },
  onEmpty:  showEmpty,
  render:   renderCard,
  doneText: g => `All ${g.total} sounds correctly picked out from their lookalikes.`,
});

// ⋮ menu: open/close and "Shuffle choices" live in game-menu.js
GameMenu.init({
  rebuild: () => { if (game.current) buildKB(); },
  reorder: () => { if (game.current) order = orderFor(game.current); },
});

// A set can't be switched off if it's the only one on: the game needs cards.
['use-builtin', 'use-custom'].forEach(id => $(id).addEventListener('change', e => {
  if (!$('use-builtin').checked && !$('use-custom').checked) e.target.checked = true;
  game.start();
}));
$('include-extra').addEventListener('change', game.start);
$('csv-btn').addEventListener('click', () => $('csv-file').click());
$('csv-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) onFile(f);
  e.target.value = '';
});
$('csv-clear').addEventListener('click', clearCsv);

loadSaved();
syncSets();
game.start();
</script>
</body>
</html>
