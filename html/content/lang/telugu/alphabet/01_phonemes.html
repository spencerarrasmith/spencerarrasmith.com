<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Phonemes</title>
  <link rel="stylesheet" href="../game.css">
</head>
<body>
<div class="game-wrap">

  <!-- ── Progress header ── -->
  <header class="g-header">
    <div class="g-header-top">
      <div class="g-title-row">
        <span class="g-title" id="g-title">Telugu → IPA</span>
      </div>
      <div class="g-right">
        <div class="g-stats">
          <span>Remaining&nbsp;<span class="g-stat-val" id="s-rem">0</span></span>
          <span>Correct&nbsp;<span class="g-stat-val" id="s-done">0</span>/<span class="g-stat-val" id="s-total">0</span></span>
          <span class="g-lives" id="s-lives" role="img" hidden></span>
        </div>
      </div>
    </div>
    <div class="g-prog-track">
      <div class="g-prog-fill" id="prog-fill"></div>
    </div>
  </header>

  <!-- ── Game main ── -->
  <div class="g-main" id="g-main">
    <div class="card-area">
      <div class="char-card" id="char-card">
        <span class="cat-badge" id="cat-badge">Vowel</span>
        <span class="tel-char" id="tel-char">అ</span>
        <span class="rare-badge" id="rare-badge" style="display:none">rare</span>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="kb-area" id="kb-area"></div>
  </div>

  <!-- ── Complete screen (filled in by game-core.js) ── -->
  <div class="g-complete" id="g-complete"></div>

</div>

<script src="../settings.js"></script>
<script src="../telugu-data.js"></script>
<script src="../progress.js"></script>
<script src="../game-menu.js"></script>
<script src="../game-core.js"></script>
<script src="../game-setup.js"></script>
<script>
if (!window.TeluguData) throw new Error('../telugu-data.js was not found');
if (!window.GameCore)   throw new Error('../game-core.js was not found');
if (!window.GameSetup)  throw new Error('../game-setup.js was not found');

/* ─────────────────────────────────────────────────────────
   DATA
   Letters, flags, and keyboard groups all come from
   telugu-data.js. The book's set (51 cards) is the default;
   "Include extra letters" adds ఌ ౡ ఱ.
     rare    → "rare" badge on the card
     inBook  → false for the extras

   The round itself (deck, counters, re-queuing a missed card,
   the complete screen, the record of each session) is game-core.js.
   The popup that opens first is game-setup.js. It holds every
   option: direction, number of rounds, mistakes allowed, and
   the five checkboxes. There is no ⋮ menu on this page.
   This page draws the card and the keyboard and checks answers.
───────────────────────────────────────────────────────── */
const GAME  = 'phonemes';                // tile id: finishing either direction checks off the tile
const CHARS = TeluguData.letters;
const N     = TeluguData.notation;       // how sounds are written: IPA (/k/) or ISO (ka), chosen on the home page
const { $, shuffle } = GameCore;

/* ─────────────────────────────────────────────────────────
   STATE
   reversed = false → card shows the Telugu letter, keys show its sound
   reversed = true  → card shows the sound, keys show Telugu
   The keyboard itself (layout, order, groups) is built by
   TeluguData.buildKeyboard, so it lives with the alphabet data.
───────────────────────────────────────────────────────── */
let reversed = false;

// Both keyboards share one key per letter; match by the letter itself
// (data-ch is unique, data-ipa is unique too, but the glyph is the identity).
function btnForLetter(letter) {
  return Array.from(document.querySelectorAll('.kb-btn'))
    .find(b => b.dataset.ch === letter.ch) || null;
}

/* ─────────────────────────────────────────────────────────
   BUILD KEYBOARD  (layout comes from telugu-data.js)
───────────────────────────────────────────────────────── */
// Both keyboards (sound and Telugu) follow the options in the session popup:
//   Show categories checked   → grouped and labeled by place of articulation
//   Show categories unchecked → one plain block of keys, alphabet order
//   Shuffle keyboard checked  → that block in a random order (kbOrder), which
//                              stays fixed for the round so keys can be found
// Rebuilding (when one of those two boxes changes) never restarts the round.
let activeLetters = new Set();
let kbOrder = null;                      // null = alphabet order
function buildKB() {
  TeluguData.buildKeyboard($('kb-area'), {
    face:    reversed ? 'telugu' : 'sound',
    visible: activeLetters,
    grouped: GameMenu.grouped(),
    order:   kbOrder,
    onPick:  onAnswer,
  });
}

/* ─────────────────────────────────────────────────────────
   RENDER CURRENT CARD
───────────────────────────────────────────────────────── */
function renderCard(c) {
  const tel = $('tel-char');
  if (reversed) {
    // the sound, /k/ or ka; longer strings (tʃʰ, dʒʱ, kha) step down a size
    const sound = N.letter(c), n = [...sound].length;
    tel.className      = 'tel-char ipa-face';
    tel.innerHTML      = N.html(sound);
    tel.style.fontSize = n >= 4 ? '3.4rem' : n === 3 ? '4.2rem' : '';
  } else {
    tel.className      = 'tel-char';
    tel.textContent    = c.ch;
    tel.style.fontSize = [...c.ch].length >= 3 ? '4.2rem' : '';   // wide conjunct (క్ష)
  }
  $('cat-badge').textContent       = c.cat;
  $('cat-badge').style.visibility  = $('show-cat').checked ? '' : 'hidden';
  $('rare-badge').style.display    = c.rare ? '' : 'none';
}

/* ─────────────────────────────────────────────────────────
   ANSWER HANDLER
───────────────────────────────────────────────────────── */
function onAnswer(letter, btn) {
  if (game.locked) return;
  const cur = game.current;
  const ok  = (letter === cur);

  btn.classList.add(ok ? 'ok' : 'err');

  // Wrong: highlight the correct key and scroll it into view (optional).
  // The line under the card says what was picked (the key just pressed), right or wrong.
  // It never gives the answer: with the highlight off, a wrong guess leaves it unsaid.
  const correctBtn = !ok && $('highlight-correct').checked ? btnForLetter(cur) : null;
  if (correctBtn) {
    correctBtn.classList.add('ok');
    correctBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  game.judge(ok, {
    feedback: `${ok ? '✓' : '✗'}  ${reversed ? letter.ch : N.wrap(N.letter(letter))}`,
    te:       reversed,
    miss:     reversed
      ? { game: GAME + '-reverse', key: cur.ch, ask: 'sound',  note: cur.cat }
      : { game: GAME,              key: cur.ch, ask: 'telugu', note: cur.cat },
    after() {
      btn.classList.remove('ok', 'err');
      if (correctBtn) correctBtn.classList.remove('ok');
    },
  });
}

/* ─────────────────────────────────────────────────────────
   THE ROUND  (game-core.js)
───────────────────────────────────────────────────────── */
const pool = () => TeluguData.pool(CHARS, $('include-extra').checked);
const game = GameCore.create({
  id:    GAME,
  errMs: 1500,                           // a wrong pick stays on screen for a second and a half
  pool,
  onRetry: () => openSetup(),            // "Practice Again" asks how to play the next session
  variant: () => (reversed ? 'reverse' : ''),   // kept with each session's result (the Profile page)
  onStart(g) {
    $('kb-area').scrollTop = 0;
    activeLetters = new Set(pool());     // every letter in play is a key, however few rounds are dealt
    kbOrder = GameMenu.shuffled() ? shuffle(CHARS) : null;   // fresh order each round
    buildKB();
  },
  render:   renderCard,
  doneText: g => reversed
    ? `All ${g.total} ${SOUNDS} correctly matched to their Telugu akshara.`
    : `All ${g.total} Telugu akshara correctly matched to their ${SOUNDS}.`,
});
const SOUNDS = N.id === 'iso' ? 'ISO spellings' : 'IPA phonemes';

// The two ways around, in the reader's notation. The title says which one is being played.
const DIRECTIONS = [`Telugu → ${N.name}`, `${N.name} → Telugu`];
function showDirection() { $('g-title').textContent = DIRECTIONS[reversed ? 1 : 0]; }

/* ─────────────────────────────────────────────────────────
   SESSION SETUP  (game-setup.js)
   The popup that opens with the page, and again from
   "Practice Again". Every option is in it; the checkboxes
   keep the ids this page reads them by. Start deals a new
   session with what it shows.
───────────────────────────────────────────────────────── */
const setup = GameSetup.create({
  title:     'Phonemes',
  home:      '../index.html',
  direction: DIRECTIONS,
  options: [
    { id: 'show-cat',          label: 'Show categories', checked: true,
      note: { id: 'cat-note', text: 'Off while keyboard is shuffled' } },
    { id: 'shuffle-kb',        label: 'Shuffle keyboard' },
    { id: 'include-extra',     label: 'Include extra letters' },
    { id: 'highlight-correct', label: 'Highlight correct answer', checked: true },
    { id: 'missed-again',      label: 'Missed guesses reappear', checked: true },
  ],
  max: () => pool().length,              // 51, or 54 with the extra letters
  onStart(v) {
    reversed = v.reversed;
    showDirection();
    game.start({ size: v.rounds, misses: v.misses, again: $('missed-again').checked });
  },
});
// leave: Cancel goes back to Home (only when the page has just opened and nothing was played)
const openSetup = (leave = false) => setup.open({ leave });

/* ── The keyboard options ─────────────────────────────── */
// game-menu.js keeps "Show categories" and "Shuffle keyboard" in step (a shuffled keyboard
// has no groups) and redraws the keyboard when either changes. It finds the two boxes by
// id, which is why the popup is created above this line. This page has no ⋮ menu for it to open.
GameMenu.init({
  rebuild: buildKB,
  reorder: on => { kbOrder = on ? shuffle(CHARS) : null; },
});

showDirection();
game.start();                            // a round is dealt behind the popup; Start deals the one that is played
openSetup(true);
</script>
</body>
</html>
