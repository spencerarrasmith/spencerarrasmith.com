<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lookalike Builder</title>
<link rel="stylesheet" href="../game.css">
<style>
/* ── Lookalike Builder-specific (the header, ⋮-menu checkboxes, and colors come from game.css / base.css) ── */

/* base.css fixes the height for the games; this page scrolls. The window does the scrolling, not
   <body>: the header and the bar below it can only stay in view against the thing that scrolls. */
html { height: auto; overflow: auto; }
body { height: auto; overflow: visible; }
:root { --telugu: 'Noto Sans Telugu', 'Noto Sans', sans-serif; --hdr: 47px; }   /* --hdr: the header's height; the page measures it (below) */
body { min-height: 100vh; min-height: 100dvh; }
.te { font-family: var(--telugu); }

.g-header { position: sticky; top: 0; z-index: 6; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 14px 24px calc(48px + var(--safe-bottom)); display: grid; gap: 12px; }
@media (max-width: 520px) { .wrap { padding-left: 14px; padding-right: 14px; } }

h2 { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; }
h3 { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
.hint { color: var(--text-muted); font-size: 12.5px; line-height: 1.5; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }

/* intro line with the two options beside it */
.top { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.top .hint { flex: 1 1 280px; }
select, input[type=text] {
  font: inherit; font-size: 13.5px; color: var(--text-dim);
  background: var(--surface-up); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
}
select:hover, input[type=text]:hover { border-color: var(--accent); }

/* the bar that stays in view: what the keyboard does, the character, and what it looks like */
.pick {
  position: sticky; top: var(--hdr); z-index: 5;
  display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px 18px; align-items: center;
  padding: 10px 14px; box-shadow: 0 8px 18px rgba(0,0,0,.45);
}
.mode { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
.mode-opt {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; white-space: nowrap;
  background: none; border: 1px solid transparent; border-radius: 7px; padding: 7px 12px;
}
.mode-opt:hover:not(:disabled) { color: var(--text); }
.mode-opt[aria-checked="true"] { background: var(--accent-glow); border-color: var(--accent); color: var(--accent-light); }
.mode-opt:disabled { opacity: .4; cursor: default; }
.subject { display: flex; align-items: center; gap: 12px; }
.glyph {
  font-family: var(--telugu); font-weight: 700; font-size: 46px; line-height: 1.55; min-width: 1.75em; padding: 0 10px; text-align: center; color: var(--text);
  background: radial-gradient(ellipse at 50% 45%, #1e1830 0%, #111221 70%);
  border: 1.5px solid var(--border); border-radius: 14px;
}
.glyph.empty { color: var(--text-muted); font-weight: 400; }
.prompt-name { font-size: 12px; color: var(--text-muted); line-height: 1.35; }
.prompt-name b { display: block; font-family: 'Noto Sans', 'Inter', sans-serif; color: var(--text); font-weight: 500; font-size: 17px; }
.tray { display: flex; align-items: center; gap: 10px; min-width: 0; padding-left: 18px; border-left: 1px solid var(--border); align-self: stretch; }
.tray h3 { flex-shrink: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-height: 88px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.chip {
  font-family: var(--telugu); font-size: 20px; line-height: 1.5; padding: 0 9px; cursor: pointer;
  display: inline-flex; gap: 6px; align-items: center;
  background: var(--accent); color: #0b0c18; border: 1px solid var(--accent-light); border-radius: 8px;
}
.chip small { font-family: 'Inter', sans-serif; font-size: 13px; opacity: .7; }
.chip.ghost { background: var(--surface-up); color: var(--text); border-color: var(--border); }
.chip.ghost:hover { border-color: var(--accent); }
.chip.ghost.anchor { border-color: var(--accent); color: var(--accent-light); }   /* whose group this is */

/* buttons (the primary one is the app's gold button) */
.btn {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer;
  background: var(--surface-up); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px;
  transition: background .12s, border-color .12s, filter .14s;
}
.btn:hover { border-color: var(--accent); background: var(--accent-glow); }
.btn.primary { background: var(--accent); color: #0b0c18; border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn.danger { color: var(--error); }
.btn.danger:hover { border-color: var(--error); background: var(--error-dim); }
.btn[aria-pressed="true"] { border-color: var(--accent-light); color: var(--accent-light); border-style: dashed; }
.btn:disabled { opacity: .4; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }

/* keyboard: one set of keys; the switch in the bar says whether a tap chooses the character or a lookalike */
.kb { display: grid; gap: 10px; }
.kb.looks { border-color: var(--accent); }
.kbhead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.kbhead h2 .te { font-size: 17px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--accent-light); margin-left: 4px; }
.readout { margin-left: auto; font-family: var(--telugu); font-size: 17px; color: var(--accent-light); }
.kbrow { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: start; }
.kbrow h3 { padding-top: 11px; }
.keys { display: grid; gap: 4px; }
.keys.signs { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); }
.keys.v { grid-template-columns: repeat(16, minmax(0, 1fr)); }
.keys.c { grid-template-columns: repeat(10, minmax(0, 1fr)); }           /* two rows of the varnamala side by side */
.keys.c .key:nth-child(10n+6) { margin-left: 8px; }
.keys.d { grid-template-columns: repeat(10, minmax(0, 1fr)); }
.key {
  font-family: var(--telugu); font-size: 19px; line-height: 1.5; min-height: 38px; padding: 1px 2px; cursor: pointer; overflow-wrap: anywhere;
  background: var(--surface-up); color: var(--text-dim); border: 1px solid var(--border); border-radius: 7px;
  transition: background .1s, border-color .1s, color .1s, transform .08s;
}
.key:hover:not(:disabled) { background: var(--accent-glow); border-color: var(--accent); color: var(--accent-light); }
.key:active:not(:disabled) { transform: scale(.94); }
.key.rare { border-style: dashed; }
.key.has { box-shadow: inset 0 -3px 0 var(--accent); }                   /* already has lookalikes */
.key[aria-pressed="true"] { background: var(--accent); color: #0b0c18; border-color: var(--accent-light); border-style: solid; box-shadow: none; }
.key:disabled { opacity: .28; cursor: default; }
.key.self:disabled { opacity: 1; background: var(--bg); color: var(--accent-light); border-color: var(--accent); }
.key small { display: block; font-family: 'Noto Sans', 'Inter', sans-serif; font-size: 9.5px; line-height: 1.1; color: var(--text-muted); padding-bottom: 3px; }
.key[aria-pressed="true"] small { color: #0b0c18; }
.keys.arming .key:not(:disabled) { border-color: var(--accent); border-style: dashed; }
.stack { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 3px; }
.other { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; }
.other input { flex: 0 1 200px; min-width: 0; font-family: var(--telugu); font-size: 17px; }

/* groups + CSV */
.results { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.results .card { display: grid; gap: 10px; }
.results h2 span { color: var(--text-muted); }
.group-list { display: grid; gap: 6px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
.group .n { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 11px; min-width: 1.6em; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row label { font-size: 12.5px; color: var(--text-muted); }
textarea {
  width: 100%; min-height: 130px; resize: vertical; padding: 10px;
  font-family: var(--telugu); font-size: 17px; line-height: 1.7; color: var(--text-dim);
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
}
#status { min-height: 1.4em; color: var(--accent-light); font-size: 12.5px; }

@media (max-width: 860px) {
  .results { grid-template-columns: minmax(0, 1fr); }
  .pick { grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; padding: 8px 10px; }
  .mode { grid-column: 1 / -1; }
  .mode-opt { flex: 1; }
  .glyph { font-size: 36px; }
  .prompt-name { display: none; }                      /* the key's tooltip and the Groups list still give the sound */
  .tray { padding-left: 12px; }
  .tray h3 { display: none; }
  .chips { max-height: 80px; }
  .kbrow { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .kbrow h3 { padding-top: 0; }
  .keys.v { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .keys.c { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .keys.c .key:nth-child(10n+6) { margin-left: 0; }
  .key { font-size: 18px; }
}
</style>
</head>
<body>

<header class="g-header">
  <div class="g-header-top">
    <span class="g-title">Lookalike Builder</span>
    <div class="g-right"><div class="g-stats"><span id="stat"></span></div></div>
  </div>
</header>

<div class="wrap">

  <div class="top">
    <p class="hint">Choose a character, then tap everything that looks like it. The CSV below loads into Lookalikes.</p>
    <label class="menu-opt" for="uncommon"><input type="checkbox" id="uncommon"> <span>Include extra letters</span></label>
    <select id="font" aria-label="Telugu font">
      <option value="sans">Noto Sans Telugu</option>
      <option value="serif">Noto Serif Telugu</option>
      <option value="tiro">Tiro Telugu</option>
      <option value="device">This device's font</option>
    </select>
  </div>

  <section class="card pick" id="pick" aria-label="Character and its lookalikes">
    <div class="mode" id="mode" role="radiogroup" aria-label="A tap on the keyboard chooses">
      <button type="button" class="mode-opt" role="radio" data-mode="character" data-k="mode:character">Character</button>
      <button type="button" class="mode-opt" role="radio" data-mode="looks" data-k="mode:looks">Looks like</button>
    </div>
    <div class="subject">
      <div id="glyph" class="glyph te" aria-live="polite"></div>
      <div class="prompt-name" id="promptName"></div>
    </div>
    <div class="tray">
      <h3>Looks like</h3>
      <div id="chips" class="chips"></div>
    </div>
  </section>

  <section class="card kb" id="kb" aria-label="Telugu keyboard">
    <div class="kbhead">
      <h2 id="kbTitle"></h2>
      <span class="readout" id="readout"></span>
      <button type="button" class="btn" id="kbReset">Plain letters</button>
    </div>
    <div class="kbrow">
      <h3>Vowel sign</h3>
      <div id="signs" class="keys signs"></div>
    </div>
    <div class="kbrow">
      <h3>Conjunct</h3>
      <div class="stack">
        <button type="button" class="btn" id="stack" aria-pressed="false">Top consonant</button>
        <span id="prefixChips" class="row"></span>
      </div>
    </div>
    <div class="kbrow">
      <h3>Vowels</h3>
      <div id="kVowels" class="keys v"></div>
    </div>
    <div class="kbrow">
      <h3>Consonants</h3>
      <div id="kCons" class="keys c"></div>
    </div>
    <div class="kbrow">
      <h3>Digits</h3>
      <div id="kDigits" class="keys d"></div>
    </div>
    <form class="other" id="otherForm">
      <input type="text" id="other" autocomplete="off" placeholder="or type a character" aria-label="Type a character">
      <button type="submit" class="btn">Use</button>
      <span class="hint" id="otherNote" role="status"></span>
    </form>
  </section>

  <div class="results">
    <section class="card" aria-label="Lookalike groups">
      <h2>Groups <span id="groupCount"></span></h2>
      <div id="groups" class="group-list"></div>
    </section>

    <section class="card" aria-label="CSV export">
      <h2>CSV</h2>
      <div class="row">
        <label for="format">Rows</label>
        <select id="format">
          <option value="groups">One group per character</option>
          <option value="pairs">One picked pair per row</option>
        </select>
      </div>
      <textarea id="csv" readonly aria-label="CSV preview" placeholder="Your CSV appears here."></textarea>
      <div class="row">
        <button type="button" class="btn primary" id="download">Download CSV</button>
        <button type="button" class="btn" id="copy">Copy CSV</button>
        <button type="button" class="btn" id="importBtn">Import CSV</button>
        <input type="file" id="importFile" accept=".csv,.txt,text/csv,text/plain" hidden>
        <button type="button" class="btn danger" id="clear">Clear all picks</button>
      </div>
      <p id="status" role="status"></p>
      <p class="hint">Picks are kept in this browser only. Download the CSV to keep them.</p>
    </section>
  </div>

</div>

<script src="../settings.js"></script>
<script src="../telugu-data.js"></script>
<script src="../lookalikes-data.js"></script>
<script>
(function(){
'use strict';

/* ---------- character data ----------
   Everything about a character comes from telugu-data.js, the same letters,
   sounds and flags the games use; nothing is listed twice.
   A row is [character, sound, rare, extra]:
     sound   in the reader's notation (IPA or ISO, chosen on the home page)
     rare    drawn with a dashed edge (the games' "rare" badge)
     extra   outside the book's set: offered only with "Include extra letters"
   Vowels are the single letters (అం and అః are అ with a sign, and signs have their
   own row). Signs run in the order of the vowels they stand for, then the pollu. */
var TD=window.TeluguData, LD=window.LookalikeData;
if(!TD||!LD) throw new Error('../telugu-data.js and ../lookalikes-data.js are required');
var N=TD.notation;           /* how sounds are written: IPA (/k/) or ISO (ka) */
var VIRAMA=TD.VIRAMA, RING='◌', BOX='▢';
var LET={}, SGN={};
TD.letters.forEach(function(l){LET[l.ch]=l;});
TD.signs.forEach(function(g){SGN[g.sign]=g;});
function row(ch,sound,flags){return [ch,sound,flags.rare?1:0,flags.core?0:1];}

var VOWELS=TD.vowels.filter(function(l){return Array.from(l.ch).length===1;}).map(function(l){return row(l.ch,N.letter(l),l);});

/* The consonant keys are laid out as the varnamala is recited, five to a row (the
   games' keyboards group by where a sound is made instead). Only the ORDER is
   kept here; it must name every consonant in telugu-data.js exactly once. */
var CONS_ORDER='కఖగఘఙ చఛజఝఞ టఠడఢణ తథదధన పఫబభమ యరలవశ షసహళఱ ౘౙ';
var CONS=Array.from(CONS_ORDER.replace(/\s/g,'')).map(function(ch){
  var l=LET[ch];
  if(!l||l.kind!=='consonant') throw new Error('lookalike builder: '+ch+' is not a consonant in telugu-data.js');
  return row(l.ch,N.letter(l),l);
});
if(CONS.length!==TD.consonants.length||new Set(CONS.map(function(c){return c[0];})).size!==CONS.length)
  throw new Error('lookalike builder: CONS_ORDER must list each of the '+TD.consonants.length+' consonants in telugu-data.js once');

var VOWEL_AT={};
TD.vowels.forEach(function(l,i){VOWEL_AT[l.ipa]=i;});
function signRank(g){return g.ipa in VOWEL_AT?VOWEL_AT[g.ipa]:1000;}
var SIGNS=TD.signs.filter(function(g){return g.sign!=='';})
  .sort(function(a,b){return signRank(a)-signRank(b);})
  .map(function(g){return row(g.sign,N.sign(g),g);});

var DIGITS=TD.digits.map(function(g){return [g.ch,String(g.value)];});

function toMap(list){var m=new Map();list.forEach(function(x){m.set(x[0],x[1]);});return m;}
var VOW_R=toMap(VOWELS), CONS_R=toMap(CONS), SIGN_R=toMap(SIGNS), DIG_R=toMap(DIGITS);
var ORDER=new Map();
VOWELS.concat(CONS,[[VIRAMA]],SIGNS,DIGITS).forEach(function(x){if(!ORDER.has(x[0])) ORDER.set(x[0],ORDER.size);});

/* Conjuncts are limited to the ones telugu-data.js lists. Those are the ones the Lookalikes
   game can read, so every character this page offers can be practiced there. */
var LISTED=new Map();
TD.clusters.forEach(function(c){LISTED.set(c.glyph,c);});

var FONTS={
  sans:'"Noto Sans Telugu","Kohinoor Telugu","Nirmala UI","Gautami",sans-serif',
  serif:'"Noto Serif Telugu","Telugu MN","Gautami",serif',
  tiro:'"Tiro Telugu","Noto Serif Telugu","Telugu MN",serif',
  device:'"Nirmala UI","Kohinoor Telugu","Telugu Sangam MN","Gautami",system-ui,sans-serif'
};

/* ---------- pure helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var clean=LD.clean;          /* the same cleanup the Lookalikes game applies to an uploaded CSV */

/* The sound of a character as the reader has chosen to see it: /kaː/ or kā. Any letter,
   letter with a sign or stack of consonants is read by TeluguData.read, the same reader
   the games and Review use. Digits show their number. */
function phon(s){
  if(DIG_R.has(s)) return DIG_R.get(s);
  var r=TD.read(s,{any:true});
  return r?N.wrap(N.of(r)):s;
}
function kindOf(s){
  if(VOW_R.has(s)) return 'vowel';
  if(DIG_R.has(s)) return 'digit';
  if(CONS_R.has(s)) return 'consonant';
  var chars=Array.from(s), n=chars.filter(function(c){return CONS_R.has(c);}).length;
  var last=chars[chars.length-1], signed=SIGN_R.has(last);
  if(n>=2) return (n===2?'conjunct':n+'-consonant conjunct')+(signed?(last===VIRAMA?', no vowel':' with vowel sign'):'');
  if(n===1&&signed) return last===VIRAMA?'consonant, no vowel':'consonant with vowel sign';
  return 'other';
}
function ranks(s){return Array.from(s,function(ch){return ORDER.has(ch)?ORDER.get(ch):1000+ch.codePointAt(0);});}
function cmp(a,b){
  var x=ranks(a),y=ranks(b),n=Math.min(x.length,y.length);
  for(var i=0;i<n;i++){ if(x[i]!==y[i]) return x[i]-y[i]; }
  return x.length-y.length;
}

/* ---------- state ---------- */
var KEY='telugu-lookalikes-v1';
var S={uncommon:false,font:'sans',format:'groups',mode:'character'};
var adj=new Map();          /* character -> Set of characters picked as lookalikes (symmetric) */
var P=null;                 /* the character being judged */
var kb={sign:'',prefix:[],arming:false};   /* what the consonant keys show: top consonant(s) + the key + a vowel sign */
var clearArmed=0;

function link(a,b){
  if(!a||!b||a===b) return false;
  if(!adj.has(a)) adj.set(a,new Set());
  if(!adj.has(b)) adj.set(b,new Set());
  if(adj.get(a).has(b)) return false;
  adj.get(a).add(b); adj.get(b).add(a); return true;
}
function unlink(a,b){
  [[a,b],[b,a]].forEach(function(p){
    var set=adj.get(p[0]); if(!set) return;
    set.delete(p[1]); if(!set.size) adj.delete(p[0]);
  });
}
function linked(a,b){return adj.has(a)&&adj.get(a).has(b);}
function neighbors(a){return adj.has(a)?Array.from(adj.get(a)).sort(cmp):[];}
function edges(){
  var out=[];
  adj.forEach(function(set,a){set.forEach(function(b){ if(cmp(a,b)<0) out.push([a,b]); });});
  return out.sort(function(x,y){return cmp(x[0],y[0])||cmp(x[1],y[1]);});
}
/* One group per character: the character first, then everything linked to it.
   Links work both ways (pick బ for ఒ and ఒ is already in బ's list), but groups are
   never merged, so a group is only ever a character and its own direct picks.
   Mirrored duplicates (ఒ→బ and బ→ఒ are the same two characters) are listed once. */
function groupRows(){
  var seen=new Set(),out=[];
  Array.from(adj.keys()).sort(cmp).forEach(function(a){
    var row=[a].concat(neighbors(a));
    var key=row.slice().sort(cmp).join('|');
    if(seen.has(key)) return;
    seen.add(key); out.push(row);
  });
  return out;
}
function csvText(){
  var rows=S.format==='pairs'?edges():groupRows();
  return rows.map(function(r){return r.join(',');}).join('\n');
}
/* A row links its first character to each of the others. Characters Lookalikes cannot read
   (a conjunct telugu-data.js does not list, say) are left out, and reported. */
function importCsv(text){
  var added=0, skipped=[];
  LD.rows(text).forEach(function(cells){
    var good=cells.filter(function(c){
      if(readable(c)) return true;
      if(skipped.indexOf(c)<0) skipped.push(c);
      return false;
    });
    if(good[0]!==cells[0]) return;                     /* the row's own character is unreadable: nothing to link to */
    for(var i=1;i<good.length;i++){ if(link(good[0],good[i])) added++; }
  });
  return {added:added,skipped:skipped};
}

/* What an earlier version of this page stored (its place in a fixed run, which characters
   were "reviewed") is simply not read; the picks themselves carry over. */
function load(){
  try{
    var raw=localStorage.getItem(KEY); if(!raw) return;
    var o=JSON.parse(raw);
    (o.links||[]).forEach(function(p){ if(Array.isArray(p)&&typeof p[0]==='string'&&typeof p[1]==='string') link(clean(p[0]),clean(p[1])); });
    S.uncommon=!!o.uncommon;
    if(FONTS[o.font]) S.font=o.font;
    if(o.format==='pairs') S.format='pairs';
    if(typeof o.cur==='string'&&clean(o.cur)){ P=clean(o.cur); S.mode='looks'; adopt(P); }
  }catch(e){}
}
function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify({links:edges(),uncommon:S.uncommon,font:S.font,format:S.format,cur:P}));
  }catch(e){}
}

/* ---------- what the keyboard offers ---------- */
function offered(x){return S.uncommon||!x[3];}                     /* a letter or sign row: extras wait for the option */
function clusterOk(c){return !!c&&(S.uncommon||c.core);}           /* a listed conjunct: the uncommon ones wait too */
function form(c){return kb.prefix.map(function(p){return p+VIRAMA;}).join('')+c+kb.sign;}
/* The consonant key c, under the top consonant(s) chosen: is that stack a listed conjunct? */
function stackOk(c){return !kb.prefix.length||clusterOk(LISTED.get(kb.prefix.concat([c]).join(VIRAMA)));}
/* Can c go on top (after any already chosen)? Only if some listed conjunct starts that way. */
function topOk(c){
  var head=kb.prefix.concat([c]).join(VIRAMA)+VIRAMA;
  return TD.clusters.some(function(x){return clusterOk(x)&&x.glyph.indexOf(head)===0;});
}
function resetKb(){kb.sign='';kb.prefix=[];kb.arming=false;}
/* Set the keyboard to the shape of a character (its top consonants and vowel sign), so its
   likely lookalikes are one tap away. Anything that is not such a stack gets plain letters. */
function adopt(ch){
  resetKb();
  var chars=Array.from(ch), sign='';
  if(chars.length>1&&SIGN_R.has(chars[chars.length-1])&&offered([0,0,0,SGN[chars[chars.length-1]].core?0:1])) sign=chars.pop();
  var parts=chars.join('').split(VIRAMA);
  if(chars.length&&parts.every(function(x){return CONS_R.has(x);})){
    var top=parts.slice(0,-1);
    if(!top.length||clusterOk(LISTED.get(parts.join(VIRAMA)))){ kb.prefix=top; kb.sign=sign; }
  }
}
/* Typed text is accepted when Lookalikes can read it (a digit is shown as its number). */
function readable(t){return DIG_R.has(t)||!!LD.item(t);}

/* ---------- rendering ---------- */
function $(id){return document.getElementById(id);}
function say(msg){$('status').textContent=msg;}

/* A character key. Choosing the character: the current one is pressed, and a bar marks those
   that already have lookalikes. Choosing lookalikes: the linked ones are pressed, and the
   character itself is shown but cannot be tapped. */
function keyHTML(ch,o){
  var looks=S.mode==='looks', self=ch===P;
  var pressed=looks?(!!P&&!self&&linked(P,ch)):self;
  var off=o.off||(looks&&self);
  return '<button type="button" class="key'+(o.rare?' rare':'')+(self?' self':'')+(!looks&&adj.has(ch)?' has':'')+'" data-k="ch:'+esc(ch)+'" data-ch="'+esc(ch)+'"'+
    (o.base?' data-base="'+esc(o.base)+'"':'')+' aria-pressed="'+pressed+'" title="'+esc(phon(ch))+(self&&looks?' (the character shown)':'')+'"'+(off?' disabled':'')+'>'+esc(ch)+'</button>';
}
function renderKeyboard(){
  var combining=!!(kb.sign||kb.prefix.length), looks=S.mode==='looks';
  $('kb').className='card kb'+(looks?' looks':'');
  $('kbTitle').innerHTML=looks?'Looks like <span class="te">'+esc(P)+'</span>':'Character';
  $('signs').innerHTML=SIGNS.filter(offered).map(function(s){
    return '<button type="button" class="key'+(s[2]?' rare':'')+'" data-k="sign:'+s[0]+'" data-sign="'+s[0]+'" aria-pressed="'+(kb.sign===s[0])+'" title="'+(s[1]?'vowel sign '+esc(s[1]):'no vowel (pollu)')+'">'+RING+s[0]+'<small>'+(s[1]||'none')+'</small></button>';
  }).join('');
  $('kVowels').innerHTML=VOWELS.map(function(v){return keyHTML(v[0],{rare:v[2],off:combining||kb.arming||!offered(v)});}).join('');
  $('kDigits').innerHTML=DIGITS.map(function(v){return keyHTML(v[0],{off:combining||kb.arming});}).join('');
  var cons=$('kCons');
  cons.className='keys c'+(kb.arming?' arming':'');
  cons.innerHTML=CONS.map(function(c){
    if(kb.arming) return '<button type="button" class="key'+(c[2]?' rare':'')+'" data-k="base:'+c[0]+'" data-base="'+c[0]+'" aria-pressed="false" title="'+esc(c[1])+'"'+(offered(c)&&topOk(c[0])?'':' disabled')+'>'+c[0]+'</button>';
    return keyHTML(form(c[0]),{rare:c[2],base:c[0],off:!offered(c)||!stackOk(c[0])});
  }).join('');

  var parts=kb.prefix.map(function(p){return p+VIRAMA;}).concat([BOX]);
  if(kb.sign) parts.push(RING+kb.sign);
  $('readout').textContent=combining?parts.join(' + '):'';
  $('kbReset').disabled=!combining&&!kb.arming;
  var stack=$('stack');
  stack.setAttribute('aria-pressed',String(kb.arming));
  stack.textContent=kb.arming?'Tap a consonant…':(kb.prefix.length?'Add another':'Top consonant');
  stack.disabled=!kb.arming&&(kb.prefix.length>=2||!CONS.some(function(c){return offered(c)&&topOk(c[0]);}));
  $('prefixChips').innerHTML=kb.prefix.map(function(p,i){
    return '<button type="button" class="chip ghost" data-k="unprefix:'+i+'" data-unprefix="'+i+'" title="Remove '+esc(phon(p))+'">'+p+VIRAMA+' <small>×</small></button>';
  }).join('');
}
function renderPick(){
  var g=$('glyph'), n=P?neighbors(P):[];
  Array.prototype.forEach.call(document.querySelectorAll('.mode-opt'),function(b){
    b.setAttribute('aria-checked',String(b.dataset.mode===S.mode));
    b.disabled=b.dataset.mode==='looks'&&!P;
  });
  g.className='glyph te'+(P?'':' empty'); g.textContent=P||'?';
  $('promptName').innerHTML=P?'<b>'+esc(phon(P))+'</b>'+esc(kindOf(P)):'';
  $('chips').innerHTML=!P?'<span class="hint">Choose a character on the keyboard.</span>':n.length?n.map(function(c){
    return '<button type="button" class="chip" data-k="rm:'+esc(c)+'" data-remove="'+esc(c)+'" title="Remove '+esc(phon(c))+'">'+esc(c)+' <small>×</small></button>';
  }).join(''):'<span class="hint">Nothing picked yet.</span>';
}
function renderResults(){
  var groups=groupRows();
  $('stat').textContent=groups.length+(groups.length===1?' group':' groups');
  $('groupCount').textContent=groups.length?'('+groups.length+')':'';
  $('groups').innerHTML=groups.length?groups.map(function(grp,i){
    return '<div class="group"><span class="n">'+(i+1)+'</span>'+grp.map(function(c,j){
      return '<button type="button" class="chip ghost'+(j===0?' anchor':'')+'" data-k="go:'+esc(c)+'" data-goto="'+esc(c)+'" title="'+esc(phon(c))+'">'+esc(c)+'</button>';
    }).join('')+'</div>';
  }).join(''):'<p class="hint">No groups yet.</p>';
  $('csv').value=csvText();
  $('format').value=S.format;
}
function renderSettings(){
  $('uncommon').checked=S.uncommon;
  $('font').value=S.font;
  document.documentElement.style.setProperty('--telugu',FONTS[S.font]);
}
function render(){
  var active=document.activeElement, k=active&&active.dataset?active.dataset.k:null;
  renderSettings(); renderPick(); renderKeyboard(); renderResults();
  if(k){
    var again=Array.prototype.filter.call(document.querySelectorAll('[data-k]'),function(el){return el.dataset.k===k;})[0];
    if(again&&!again.disabled) again.focus();
  }
}

/* ---------- actions ---------- */
function toggle(ch){
  if(!P||!ch||ch===P) return;
  if(linked(P,ch)) unlink(P,ch); else link(P,ch);
  persist(); render();
}
/* Choosing a character turns the keyboard over to its lookalikes, which is the next thing to
   do. The vowel sign and top consonant stay as they are: lookalikes mostly share them. */
function choose(ch){
  P=ch; S.mode='looks';
  persist(); render();
}
function tap(ch){
  if(S.mode==='looks'&&P) toggle(ch); else choose(ch);
}
function goTo(ch){ adopt(ch); choose(ch); }
function setMode(m){
  if(m===S.mode||(m==='looks'&&!P)) return;
  S.mode=m; kb.arming=false; render();
}

$('mode').addEventListener('click',function(e){var b=e.target.closest('[data-mode]'); if(b&&!b.disabled) setMode(b.dataset.mode);});
$('kb').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.sign!==undefined){ kb.sign=kb.sign===b.dataset.sign?'':b.dataset.sign; kb.arming=false; render(); }
  else if(b.dataset.unprefix!==undefined){ kb.prefix.splice(Number(b.dataset.unprefix),1); render(); }
  else if(kb.arming&&b.dataset.base){ kb.prefix.push(b.dataset.base); kb.arming=false; render(); }
  else if(b.dataset.ch){ tap(b.dataset.ch); }
  else if(b.id==='stack'){ kb.arming=!kb.arming; render(); }
  else if(b.id==='kbReset'){ resetKb(); render(); }
});
$('otherForm').addEventListener('submit',function(e){
  e.preventDefault();
  var t=clean($('other').value); if(!t) return;
  if(!readable(t)){ $('otherNote').textContent='Lookalikes cannot read '+t+'.'; return; }
  $('other').value=''; $('otherNote').textContent='';
  if(S.mode==='looks'&&P){ if(t!==P&&!linked(P,t)) toggle(t); }
  else goTo(t);
});
$('chips').addEventListener('click',function(e){var b=e.target.closest('[data-remove]'); if(b) toggle(b.dataset.remove);});
$('groups').addEventListener('click',function(e){var b=e.target.closest('[data-goto]'); if(b) goTo(b.dataset.goto);});

$('uncommon').addEventListener('change',function(e){
  S.uncommon=e.target.checked;
  /* turning extras off: drop a sign or a stack that is no longer offered */
  if(!S.uncommon){
    if(kb.sign&&SIGNS.some(function(s){return s[0]===kb.sign&&s[3];})) kb.sign='';
    if(kb.prefix.length&&!CONS.some(function(c){return offered(c)&&stackOk(c[0]);})&&!CONS.some(function(c){return offered(c)&&topOk(c[0]);})) kb.prefix=[];
  }
  persist(); render();
});
$('font').addEventListener('change',function(e){S.font=e.target.value;persist();render();});
$('format').addEventListener('change',function(e){S.format=e.target.value;persist();renderResults();});

$('download').addEventListener('click',function(){
  var text=csvText(); if(!text){say('Nothing to export yet. Pick a lookalike first.');return;}
  var filename='telugu_lookalikes_'+S.format+'.csv';
  try{
    var url=URL.createObjectURL(new Blob([text+'\n'],{type:'text/csv;charset=utf-8'}));
    var a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
    say('Saved '+filename+'.');
  }catch(err){ say('Download did not go through. Use Copy CSV instead.'); }
});
$('copy').addEventListener('click',async function(){
  var text=csvText(); if(!text){say('Nothing to copy yet. Pick a lookalike first.');return;}
  try{ await navigator.clipboard.writeText(text+'\n'); say('CSV copied.'); }
  catch(err){ $('csv').focus(); $('csv').select(); say('Copying was blocked. The CSV is selected: press Ctrl+C or ⌘C.'); }
});
$('importBtn').addEventListener('click',function(){$('importFile').click();});
$('importFile').addEventListener('change',function(e){
  var file=e.target.files&&e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    var got=importCsv(reader.result), added=got.added;
    var left=got.skipped.length?' Skipped '+got.skipped.length+' that Lookalikes cannot read: '+got.skipped.slice(0,8).join(' ')+(got.skipped.length>8?' …':'')+'.':'';
    persist(); render();
    say((added?'Imported '+added+(added===1?' link':' links')+' from '+file.name+'.':'No new links found in '+file.name+'. Each row needs two or more characters separated by commas.')+left);
  };
  reader.onerror=function(){say('That file could not be read. Choose a .csv saved as UTF-8.');};
  reader.readAsText(file);
  e.target.value='';
});
$('clear').addEventListener('click',function(){
  var btn=$('clear');
  if(Date.now()-clearArmed<5000){
    adj.clear(); clearArmed=0;
    btn.textContent='Clear all picks'; persist(); render(); say('All picks cleared.');
  }else{
    clearArmed=Date.now(); btn.textContent='Click again to clear everything';
    setTimeout(function(){ if(clearArmed&&Date.now()-clearArmed>=5000){clearArmed=0;btn.textContent='Clear all picks';} },5100);
  }
});

/* ---------- start ---------- */
load(); render();

/* The bar sticks just under the header, so it needs the header's real height. That is a pixel or
   two different from one font to the next (when the web font has not loaded, say), so it is
   measured, and measured again whenever the header changes size. */
(function(){
  var header=document.querySelector('.g-header');
  function fit(){document.documentElement.style.setProperty('--hdr',header.getBoundingClientRect().height+'px');}
  fit();
  if(window.ResizeObserver) new ResizeObserver(fit).observe(header);
  window.addEventListener('resize',fit);
  window.addEventListener('load',fit);
})();
})();
</script>
</body>
