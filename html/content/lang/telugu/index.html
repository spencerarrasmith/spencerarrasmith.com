<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Telugu Suite</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>

<main id="home">
  <div class="home-inner">
    <header class="hero">
      <div class="logo">తె</div>
      <div>
        <h1 class="hero-title" id="hero-title">Telugu Telusu</h1>
      </div>
      <!-- top right: who is logged in (and Log In / Log Out), the Profile page, and the Settings menu -->
      <div class="hero-tools">
        <div class="account" id="account" hidden>
          <span class="account-name" id="account-name" hidden></span>
          <button class="account-btn" id="account-btn" type="button">Log In</button>
        </div>
        <a class="icon-btn" id="profile-btn" href="#/profile" aria-label="Profile" title="Profile">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6.6" r="3.4"/><path d="M3.2 17.2c.5-3.6 3.3-5.6 6.8-5.6s6.3 2 6.8 5.6"/></svg>
        </a>
        <div class="settings-wrap" id="settings-wrap">
          <button class="icon-btn" id="settings-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="settings-menu" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13"/></svg>
          </button>
          <div class="settings-menu" id="settings-menu" role="group" aria-label="Settings" hidden>
            <div class="settings-title">Settings</div>
            <div class="prefs" id="prefs"></div>
          </div>
        </div>
      </div>
    </header>
    <div id="sections"></div>
  </div>
</main>

<div id="app" hidden>
  <div class="app-bar">
    <a class="back" href="#/">← Home</a>
    <span class="app-title" id="app-title"></span>
  </div>
  <iframe id="app-frame" title="Sub-app"></iframe>
</div>

<!-- Logging in (and the question asked when logging out would lose progress). Opened from the top right. -->
<div class="login" id="login" hidden>
  <div class="login-box" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="login-head">
      <button class="login-btn" id="login-cancel" type="button">Cancel</button>
      <h2 class="login-title" id="login-title">Log In</h2>
    </div>
    <div class="login-body">
      <div class="login-step" id="login-start">
        <p class="login-lead">Keep your progress and statistics on every device.</p>
        <button class="login-btn wide" id="login-google" type="button">Continue with Google</button>
        <div class="login-or">or</div>
        <form class="login-form" id="login-email-form" novalidate>
          <label class="login-label" for="login-email">Email</label>
          <div class="login-row">
            <input class="login-input" id="login-email" type="email" autocomplete="email" spellcheck="false" required>
            <button class="login-btn go" id="login-send" type="submit">Send Code</button>
          </div>
        </form>
      </div>
      <form class="login-step" id="login-code-form" novalidate hidden>
        <p class="login-lead">Enter the 6-digit code sent to <b id="login-sent-to"></b>.</p>
        <label class="login-label" for="login-code">Code</label>
        <div class="login-row">
          <input class="login-input code" id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
          <button class="login-btn go" id="login-enter" type="submit">Log In</button>
        </div>
        <button class="login-link" id="login-back" type="button">Use a Different Email</button>
      </form>
      <div class="login-step" id="login-out" hidden>
        <p class="login-lead">Your latest progress has not reached your account yet. Logging out now removes it from this device.</p>
        <div class="login-row end">
          <button class="login-btn" id="login-stay" type="button">Stay Logged In</button>
          <button class="login-btn danger" id="login-out-anyway" type="button">Log Out Anyway</button>
        </div>
      </div>
      <p class="login-error" id="login-error" role="alert" hidden></p>
    </div>
  </div>
</div>

<script src="settings.js"></script>
<script src="units.js"></script>
<script src="progress.js"></script>
<script src="vendor/pocketbase-0.29.0.umd.js"></script>
<script src="sync.js"></script>
<script>
/* ─────────────────────────────────────────────────────────
   CONFIG — the sections and tiles live in units.js.
   Edit that file to add, rename, or reorder anything here.
───────────────────────────────────────────────────────── */
if (!window.TeluguUnits) throw new Error('units.js was not found');
const SECTIONS = TeluguUnits.sections;
const REVIEW   = 'review';                 // the tile that carries the count of items waiting in Review

/* ─────────────────────────────────────────────────────────
   RENDER HOME
───────────────────────────────────────────────────────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Progress is optional: without progress.js the home page simply shows no Review count.
const Progress = window.TeluguProgress || { missCount: () => 0, onChange() {} };
const Settings = window.TeluguSettings || null;

// How many items are waiting in Review, and how that reads ("3 to revisit")
const due     = () => Progress.missCount();
const dueText = n => n + ' to revisit';

// A tile: its icon and title on one line, its description under them.
// The Review tile, while items are waiting, is highlighted and says how many.
function tileHTML(t) {
  const n    = t.id === REVIEW ? due() : 0;
  const mark = t.soon ? '<span class="tile-badge">Soon</span>' : n ? `<span class="tile-badge">${esc(dueText(n))}</span>` : '';
  return `<a class="tile${t.soon ? ' soon' : ''}${n ? ' due' : ''}" href="#/${esc(t.id)}">
    <div class="tile-head">
      <div class="tile-icon" aria-hidden="true">${esc(t.icon)}</div>
      <div class="tile-title">${esc(t.title)}</div>
    </div>
    <div class="tile-desc">${esc(t.desc)}</div>${mark}</a>`;
}

/* ─────────────────────────────────────────────────────────
   COLLAPSED SECTIONS
   The arrow at the end of a section's heading folds the
   section away, leaving only that line. Which sections are
   folded is remembered in this browser, by section title.
───────────────────────────────────────────────────────── */
const FOLD_KEY = 'telugu.home.v1';
const collapsed = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(FOLD_KEY) || '{}');
  if (saved && Array.isArray(saved.collapsed)) saved.collapsed.forEach(t => { if (typeof t === 'string') collapsed.add(t); });
} catch (e) { /* storage blocked or unreadable: every section starts open */ }
const saveCollapsed = () => { try { localStorage.setItem(FOLD_KEY, JSON.stringify({ collapsed: [...collapsed] })); } catch (e) { /* lasts for this page view only */ } };

const ARROW = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 5.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// The section that holds the Review tile takes the highlight on its arrow while items are waiting,
// so a folded section still shows there is something to review. The button's label says so too.
const dueIn = s => (s.tiles.some(t => t.id === REVIEW) ? due() : 0);
const toggleLabel = (s, shut) => (shut ? 'Show ' : 'Hide ') + s.title + (dueIn(s) ? ` (${dueText(dueIn(s))})` : '');

// A section's heading line is one button, from its name across to the arrow: the whole line folds
// the section away or brings it back. The button sits inside the heading, so the heading is still a heading.
function toggleHTML(s, i) {
  const shut = collapsed.has(s.title), what = toggleLabel(s, shut);
  return `<button type="button" class="section-toggle" aria-expanded="${!shut}" aria-controls="section-${i}" aria-label="${esc(what)}" title="${esc(what)}"><span class="section-name">${esc(s.title)}</span>${ARROW}</button>`;
}

function renderHome() {
  document.getElementById('sections').innerHTML = SECTIONS.map((s, i) => `
    <section class="section${collapsed.has(s.title) ? ' collapsed' : ''}${dueIn(s) ? ' has-due' : ''}" data-section="${esc(s.title)}">
      <div class="section-head">
        <h2 class="section-title">${toggleHTML(s, i)}</h2>
      </div>
      <div class="tiles" id="section-${i}"${collapsed.has(s.title) ? ' hidden' : ''}>${s.tiles.map(tileHTML).join('')}</div>
    </section>`).join('');
}
renderHome();

// A click anywhere on a heading line folds its section away or brings it back. Only that section is touched, so the button keeps the focus.
document.getElementById('sections').addEventListener('click', e => {
  const btn = e.target.closest('.section-toggle');
  if (!btn) return;
  const section = btn.closest('.section'), title = section.dataset.section;
  const shut = !collapsed.has(title);
  if (shut) collapsed.add(title); else collapsed.delete(title);
  saveCollapsed();
  section.classList.toggle('collapsed', shut);
  section.querySelector('.tiles').hidden = shut;
  const what = toggleLabel(SECTIONS.find(s => s.title === title), shut);
  btn.setAttribute('aria-expanded', String(!shut));
  btn.setAttribute('aria-label', what);
  btn.title = what;
});

/* ─────────────────────────────────────────────────────────
   SETTINGS  (settings.js)
   The ☰ button at the top right opens the Settings menu. One
   setting so far: how sounds are written, everywhere in the
   app, IPA or ISO. This is the only place it is chosen. Every
   page reads it as it loads, and a page is loaded afresh each
   time it is opened from here, so the next page opened shows
   the new choice.
───────────────────────────────────────────────────────── */
function renderPrefs() {
  const box = document.getElementById('prefs');
  if (!Settings) { box.hidden = true; return; }
  const now  = Settings.get('notation');
  const opts = Settings.options('notation');
  box.innerHTML = `
    <div class="pref" role="radiogroup" aria-label="How sounds are written">
      <span class="pref-label">Sounds as</span>
      <span class="seg">${opts.map(o => `<button type="button" class="seg-opt${o.value === now ? ' on' : ''}" role="radio"
        aria-checked="${o.value === now}" data-value="${esc(o.value)}" title="${esc(o.hint)}">${esc(o.label)}</button>`).join('')}</span>
      <span class="pref-eg" id="pref-eg"><span class="te">క</span> is written <b>${esc(opts.find(o => o.value === now).example)}</b></span>
    </div>`;
}
document.getElementById('prefs').addEventListener('click', e => {
  const b = e.target.closest('.seg-opt');
  if (b && Settings.set('notation', b.dataset.value)) renderPrefs();
});
if (Settings) Settings.onChange(renderPrefs);        // another tab changed it
renderPrefs();

// The menu: ☰ opens and closes it. It stays open while a setting is changed, and closes
// on a tap anywhere else, or Escape (which hands the focus back to the button).
(function settingsMenu() {
  const wrap = document.getElementById('settings-wrap'), btn = document.getElementById('settings-btn'), menu = document.getElementById('settings-menu');
  const setOpen = open => { menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); };
  btn.addEventListener('click', () => setOpen(menu.hidden));
  document.addEventListener('pointerdown', e => { if (!menu.hidden && !wrap.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { setOpen(false); btn.focus(); } });
  window.addEventListener('hashchange', () => setOpen(false));
})();

/* ─────────────────────────────────────────────────────────
   ACCOUNT  (sync.js)
   At the top right, before the Profile button: the name of
   whoever is logged in and "Log Out", or just "Log In". Hovering
   the name says how syncing is going. Log In opens a popup with
   two ways in: Google, or a 6-digit code sent by email.
   Logging out empties this browser (the account keeps it all);
   if the latest progress has not reached the account yet, the
   popup asks first.
   Without sync.js (the app opened as a file, say), none of this
   is shown, and progress stays in this browser as before.
───────────────────────────────────────────────────────── */
(function account() {
  const Sync = window.TeluguSync;
  if (!Sync) return;
  const $ = id => document.getElementById(id);
  const box = $('account'), name = $('account-name'), btn = $('account-btn'), dlg = $('login'), err = $('login-error');
  box.hidden = false;

  const time = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const STATUS = {
    syncing: () => 'Syncing…',
    synced:  () => 'Synced' + (Sync.synced ? ' at ' + time(Sync.synced) : ''),
    offline: () => 'Offline: your progress will sync when you are back online',
    error:   () => 'Could not reach your account: trying again soon',
  };
  function render() {
    const inn = Sync.loggedIn;
    box.dataset.status = Sync.status;
    name.hidden = !inn;
    name.textContent = inn ? Sync.name : '';
    name.title = inn ? [Sync.name !== Sync.email ? Sync.email : '', (STATUS[Sync.status] || (() => ''))()].filter(Boolean).join(' · ') : '';
    if (!btn.disabled) btn.textContent = inn ? 'Log Out' : 'Log In';
  }
  Sync.onChange(render);
  render();

  // the popup: one step at a time (start → code), or the question before logging out
  let otpId = null;
  const STEPS = ['login-start', 'login-code-form', 'login-out'];
  function step(id, focus) {
    STEPS.forEach(s => { $(s).hidden = s !== id; });
    $('login-title').textContent = id === 'login-out' ? 'Log Out' : 'Log In';
    say('');
    if (focus) $(focus).focus();
  }
  function open(id, focus) { dlg.hidden = false; step(id, focus); }
  function close() { dlg.hidden = true; otpId = null; busy(false); btn.focus(); }
  const say = text => { err.textContent = text; err.hidden = !text; };
  const busy = (on, b, label) => {                    // while waiting: everything off, and the button pressed says what it is waiting for
    dlg.querySelectorAll('button, input').forEach(el => {
      el.disabled = on;
      if (!on && el.dataset.label) { el.textContent = el.dataset.label; delete el.dataset.label; }
    });
    if (on && b) { b.dataset.label = b.textContent; b.textContent = label; }
  };
  const problem = (e, fallback) =>
    e && e.code === 'blocked' ? 'Your browser blocked the login window. Allow pop-ups for this site and try again.'
    : e && e.status === 429 ? 'Too many tries. Wait a minute, then try again.'
    : e && e.status === 0 && !e.isAbort && e.originalError && e.originalError.name === 'TypeError' ? 'Could not reach the server. Check your connection and try again.'
    : fallback;

  btn.addEventListener('click', async () => {
    if (!Sync.loggedIn) { open('login-start', 'login-email'); return; }
    btn.disabled = true; btn.textContent = 'Logging Out…';
    const out = await Sync.logOut();
    btn.disabled = false; render();
    if (!out) open('login-out', 'login-stay');
  });
  $('login-cancel').addEventListener('click', close);
  $('login-stay').addEventListener('click', close);
  dlg.addEventListener('pointerdown', e => { if (e.target === dlg) close(); });       // a tap outside the box
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !dlg.hidden) close(); });
  window.addEventListener('hashchange', () => { if (!dlg.hidden) close(); });

  $('login-google').addEventListener('click', () => {
    const popup = window.open('', 'telugu-login', 'popup,width=500,height=650');     // now, while the click still counts
    busy(true, $('login-google'), 'Waiting for Google…'); say('');
    Sync.logInWith('google', popup).then(close, e => {
      busy(false, $('login-google'));
      if (!e || e.code !== 'closed') say(problem(e, 'The Google login did not finish. Try again.'));
    });
  });
  $('login-email-form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('login-email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say('Enter your email address.'); $('login-email').focus(); return; }
    busy(true, $('login-send'), 'Sending…'); say('');
    try {
      otpId = await Sync.sendCode(email);
      busy(false, $('login-send'));
      $('login-sent-to').textContent = email; $('login-code').value = '';
      step('login-code-form', 'login-code');
    } catch (x) { busy(false, $('login-send')); say(problem(x, 'Could not send a code to that address.')); }
  });
  $('login-code-form').addEventListener('submit', async e => {
    e.preventDefault();
    const code = $('login-code').value.replace(/\D/g, '');
    if (code.length !== 6) { say('The code is 6 digits.'); $('login-code').focus(); return; }
    busy(true, $('login-enter'), 'Logging In…'); say('');
    try { await Sync.enterCode(otpId, code); close(); }
    catch (x) { busy(false, $('login-enter')); say(problem(x, 'That code is not right, or it has expired. Check it, or send a new one.')); $('login-code').focus(); }
  });
  $('login-back').addEventListener('click', () => step('login-start', 'login-email'));
  $('login-out-anyway').addEventListener('click', async () => {
    busy(true, $('login-out-anyway'), 'Logging Out…');
    await Sync.logOut({ force: true });
    close(); render();
  });
})();

/* ─────────────────────────────────────────────────────────
   ROUTING  (#/<tile-id>  → app,  anything else → home)
   PAGES are the pages that open the same way but are not
   tiles (units.js lists them too): Profile, reached from the
   top right of the home page.
───────────────────────────────────────────────────────── */
const PAGES = TeluguUnits.pages || [];
const home  = document.getElementById('home');
const app   = document.getElementById('app');
const frame = document.getElementById('app-frame');
const ALL   = TeluguUnits.all;         // every tile (units.js rejects duplicate ids)

function route() {
  const id   = location.hash.replace(/^#\/?/, '');
  const tile = ALL.find(t => t.id === id && t.src) || PAGES.find(p => p.id === id);

  if (tile) {
    home.hidden = true;
    app.hidden  = false;
    document.getElementById('app-title').textContent = tile.title;
    document.title = tile.title + ' · Telugu Suite';
    if (frame.dataset.src !== tile.src) {
      frame.src = tile.src;
      frame.title = tile.title;
      frame.dataset.src = tile.src;
    }
  } else {
    app.hidden  = true;
    home.hidden = false;
    renderHome();                          // pick up what is waiting in Review from the game just played
    document.title = 'Telugu Suite';
    frame.removeAttribute('src');          // leaving resets the sub-app
    delete frame.dataset.src;
  }
}

window.addEventListener('hashchange', route);
// a game in the iframe just wrote progress (or another tab did)
Progress.onChange(() => { if (!home.hidden) renderHome(); });
route();

/* ─────────────────────────────────────────────────────────
   THE TITLE — "Telugu Telusu" turns over into తెలుగు తెలుసు
   and back again: one card to a syllable, Latin on its
   front and Telugu on its back.
   Every FLIP_EVERY ms the cards turn, left to right; the
   turn itself takes half a second (home.css, "Title flip").
   The two faces of a card are not the same width, so each
   card is measured and takes the width of the face it is
   showing: the letters sit as close as in ordinary text,
   in either script.
   A reader who has asked for reduced motion gets the plain
   title; a screen reader always gets "Telugu Telusu".
───────────────────────────────────────────────────────── */
const TITLE = [                          // a row to a word; a pair to a card: [Latin, Telugu]
  [['Te', 'తె'], ['lu', 'లు'], ['gu', 'గు']],
  [['Te', 'తె'], ['lu', 'లు'], ['su', 'సు']],
];
const FLIP_EVERY = 5000;                 // ms from one flip to the next

(function titleFlip() {
  const h1 = document.getElementById('hero-title');
  let n = 0;                             // the card's place in the title: it turns n × 30 ms after the first
  const card = ([la, te]) => `<span class="flip" style="--i:${n++}"><span class="flip-in"><span class="flip-face la">${esc(la)}</span><span class="flip-face te" lang="te">${esc(te)}</span></span></span>`;
  const plain = TITLE.map(word => word.map(pair => pair[0]).join('')).join(' ');
  h1.innerHTML = `<span class="sr-only">${esc(plain)}</span><span class="flip-title" id="flip-title" aria-hidden="true">`
    + TITLE.map(word => `<span class="flip-word">${word.map(card).join('')}</span>`).join(' ') + '</span>';
  const title = document.getElementById('flip-title');

  // Each card's two widths, in em so they follow the title's size (it is smaller on a phone)
  function measure() {
    title.querySelectorAll('.flip').forEach(c => {
      const size = parseFloat(getComputedStyle(c).fontSize);
      const wide = face => parseFloat(getComputedStyle(c.querySelector(face)).width);
      const la = wide('.la'), te = wide('.te');
      if (size > 0 && la > 0 && te > 0) { c.style.setProperty('--la', la / size + 'em'); c.style.setProperty('--te', te / size + 'em'); }
    });
  }
  measure();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);     // the Telugu font arrives after the page
  window.addEventListener('load', measure);

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(() => {
    if (document.hidden || home.hidden) return;        // nobody is looking at the title
    title.classList.toggle('is-te');
  }, FLIP_EVERY);
})();
</script>
</body>
</html>
