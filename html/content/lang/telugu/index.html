<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Telugu Suite</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>

<main id="home">
  <div class="home-inner">
    <header class="hero">
      <div class="logo">తె</div>
      <div>
        <h1 class="hero-title" id="hero-title">Telugu Telusu</h1>
      </div>
      <div class="prefs" id="prefs"></div>
    </header>
    <div class="featured" id="featured"></div>
    <div id="sections"></div>
  </div>
</main>

<div id="app" hidden>
  <div class="app-bar">
    <a class="back" href="#/">← Home</a>
    <span class="app-title" id="app-title"></span>
  </div>
  <iframe id="app-frame" title="Sub-app"></iframe>
</div>

<script src="settings.js"></script>
<script src="units.js"></script>
<script src="progress.js"></script>
<script>
/* ─────────────────────────────────────────────────────────
   CONFIG — the sections and tiles live in units.js.
   Edit that file to add, rename, or reorder anything here.
───────────────────────────────────────────────────────── */
if (!window.TeluguUnits) throw new Error('units.js was not found');
const SECTIONS = TeluguUnits.sections;
const FEATURED = TeluguUnits.featured;     // pinned above the sections (Review)

/* ─────────────────────────────────────────────────────────
   RENDER HOME
───────────────────────────────────────────────────────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Progress is optional: without progress.js the home page simply shows no ✓ or counts.
const Progress = window.TeluguProgress || { doneIds: () => [], missCount: () => 0, onChange() {} };
const Settings = window.TeluguSettings || null;

function tileHTML(t, done) {
  const mark = t.soon ? '<span class="tile-badge">Soon</span>'
             : done.has(t.id) ? '<span class="tile-check" title="Completed" aria-label="Completed">✓</span>' : '';
  return `<a class="tile${t.soon ? ' soon' : ''}" href="#/${esc(t.id)}">
    <div class="tile-icon" aria-hidden="true">${esc(t.icon)}</div>
    <div>
      <div class="tile-title">${esc(t.title)}</div>
      <div class="tile-desc">${esc(t.desc)}</div>
    </div>${mark}</a>`;
}

function featuredHTML(t) {
  const n = Progress.missCount();
  return `<a class="tile review" href="#/${esc(t.id)}">
    <div class="tile-icon" aria-hidden="true">${esc(t.icon)}</div>
    <div class="tile-body">
      <div class="tile-title">${esc(t.title)}</div>
      <div class="tile-desc">${esc(t.desc)}</div>
    </div>
    <span class="tile-badge${n ? ' has' : ''}">${n ? n + ' to revisit' : 'All clear'}</span></a>`;
}

/* ─────────────────────────────────────────────────────────
   COLLAPSED SECTIONS
   The arrow at the end of a section's heading folds the
   section away, leaving only that line. Which sections are
   folded is remembered in this browser, by section title.
───────────────────────────────────────────────────────── */
const FOLD_KEY = 'telugu.home.v1';
const collapsed = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(FOLD_KEY) || '{}');
  if (saved && Array.isArray(saved.collapsed)) saved.collapsed.forEach(t => { if (typeof t === 'string') collapsed.add(t); });
} catch (e) { /* storage blocked or unreadable: every section starts open */ }
const saveCollapsed = () => { try { localStorage.setItem(FOLD_KEY, JSON.stringify({ collapsed: [...collapsed] })); } catch (e) { /* lasts for this page view only */ } };

const ARROW = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 5.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function toggleHTML(s, i) {
  const shut = collapsed.has(s.title), what = (shut ? 'Show ' : 'Hide ') + s.title;
  return `<button type="button" class="section-toggle" aria-expanded="${!shut}" aria-controls="section-${i}" aria-label="${esc(what)}" title="${esc(what)}">${ARROW}</button>`;
}

const readyCount = (s, done) => {
  const ready = s.tiles.filter(t => !t.soon).length;
  const n     = s.tiles.filter(t => done.has(t.id)).length;
  return `${ready} of ${s.tiles.length} ready` + (n ? ` · ${n} done` : '');
};

function renderHome() {
  const done = new Set(Progress.doneIds());
  document.getElementById('featured').innerHTML = FEATURED.map(featuredHTML).join('');
  document.getElementById('sections').innerHTML = SECTIONS.map((s, i) => `
    <section class="section${collapsed.has(s.title) ? ' collapsed' : ''}" data-section="${esc(s.title)}">
      <div class="section-head">
        <h2 class="section-title">${esc(s.title)}</h2>
        <span class="section-count">${readyCount(s, done)}</span>
        ${toggleHTML(s, i)}
      </div>
      <div class="tiles" id="section-${i}"${collapsed.has(s.title) ? ' hidden' : ''}>${s.tiles.map(t => tileHTML(t, done)).join('')}</div>
    </section>`).join('');
}
renderHome();

// The arrow folds its section away or brings it back. Only that section is touched, so the button keeps the focus.
document.getElementById('sections').addEventListener('click', e => {
  const btn = e.target.closest('.section-toggle');
  if (!btn) return;
  const section = btn.closest('.section'), title = section.dataset.section;
  const shut = !collapsed.has(title);
  if (shut) collapsed.add(title); else collapsed.delete(title);
  saveCollapsed();
  section.classList.toggle('collapsed', shut);
  section.querySelector('.tiles').hidden = shut;
  btn.setAttribute('aria-expanded', String(!shut));
  btn.setAttribute('aria-label', (shut ? 'Show ' : 'Hide ') + title);
  btn.title = (shut ? 'Show ' : 'Hide ') + title;
});

/* ─────────────────────────────────────────────────────────
   SETTINGS  (settings.js)
   How sounds are written, everywhere in the app: IPA or ISO.
   This is the only place it is chosen. Every page reads it as
   it loads, and a page is loaded afresh each time it is opened
   from here, so the next page opened shows the new choice.
───────────────────────────────────────────────────────── */
function renderPrefs() {
  const box = document.getElementById('prefs');
  if (!Settings) { box.hidden = true; return; }
  const now  = Settings.get('notation');
  const opts = Settings.options('notation');
  box.innerHTML = `
    <div class="pref" role="radiogroup" aria-label="How sounds are written">
      <span class="pref-label">Sounds as</span>
      <span class="seg">${opts.map(o => `<button type="button" class="seg-opt${o.value === now ? ' on' : ''}" role="radio"
        aria-checked="${o.value === now}" data-value="${esc(o.value)}" title="${esc(o.hint)}">${esc(o.label)}</button>`).join('')}</span>
      <span class="pref-eg" id="pref-eg"><span class="te">క</span> is written <b>${esc(opts.find(o => o.value === now).example)}</b></span>
    </div>`;
}
document.getElementById('prefs').addEventListener('click', e => {
  const b = e.target.closest('.seg-opt');
  if (b && Settings.set('notation', b.dataset.value)) renderPrefs();
});
if (Settings) Settings.onChange(renderPrefs);        // another tab changed it
renderPrefs();

/* ─────────────────────────────────────────────────────────
   ROUTING  (#/<tile-id>  → app,  anything else → home)
───────────────────────────────────────────────────────── */
const home  = document.getElementById('home');
const app   = document.getElementById('app');
const frame = document.getElementById('app-frame');
const ALL   = TeluguUnits.all;         // Review + every tile (units.js rejects duplicate ids)

function route() {
  const id   = location.hash.replace(/^#\/?/, '');
  const tile = ALL.find(t => t.id === id && t.src);

  if (tile) {
    home.hidden = true;
    app.hidden  = false;
    document.getElementById('app-title').textContent = tile.title;
    document.title = tile.title + ' · Telugu Suite';
    if (frame.dataset.src !== tile.src) {
      frame.src = tile.src;
      frame.title = tile.title;
      frame.dataset.src = tile.src;
    }
  } else {
    app.hidden  = true;
    home.hidden = false;
    renderHome();                          // pick up ✓ and the Review count from the game just played
    document.title = 'Telugu Suite';
    frame.removeAttribute('src');          // leaving resets the sub-app
    delete frame.dataset.src;
  }
}

window.addEventListener('hashchange', route);
// a game in the iframe just wrote progress (or another tab did)
Progress.onChange(() => { if (!home.hidden) renderHome(); });
route();

/* ─────────────────────────────────────────────────────────
   THE TITLE — "Telugu Telusu" turns over into తెలుగు తెలుసు
   and back again: one card to a syllable, Latin on its
   front and Telugu on its back.
   Every FLIP_EVERY ms the cards turn, left to right; the
   turn itself takes half a second (home.css, "Title flip").
   The two faces of a card are not the same width, so each
   card is measured and takes the width of the face it is
   showing: the letters sit as close as in ordinary text,
   in either script.
   A reader who has asked for reduced motion gets the plain
   title; a screen reader always gets "Telugu Telusu".
───────────────────────────────────────────────────────── */
const TITLE = [                          // a row to a word; a pair to a card: [Latin, Telugu]
  [['Te', 'తె'], ['lu', 'లు'], ['gu', 'గు']],
  [['Te', 'తె'], ['lu', 'లు'], ['su', 'సు']],
];
const FLIP_EVERY = 5000;                 // ms from one flip to the next

(function titleFlip() {
  const h1 = document.getElementById('hero-title');
  let n = 0;                             // the card's place in the title: it turns n × 30 ms after the first
  const card = ([la, te]) => `<span class="flip" style="--i:${n++}"><span class="flip-in"><span class="flip-face la">${esc(la)}</span><span class="flip-face te" lang="te">${esc(te)}</span></span></span>`;
  const plain = TITLE.map(word => word.map(pair => pair[0]).join('')).join(' ');
  h1.innerHTML = `<span class="sr-only">${esc(plain)}</span><span class="flip-title" id="flip-title" aria-hidden="true">`
    + TITLE.map(word => `<span class="flip-word">${word.map(card).join('')}</span>`).join(' ') + '</span>';
  const title = document.getElementById('flip-title');

  // Each card's two widths, in em so they follow the title's size (it is smaller on a phone)
  function measure() {
    title.querySelectorAll('.flip').forEach(c => {
      const size = parseFloat(getComputedStyle(c).fontSize);
      const wide = face => parseFloat(getComputedStyle(c.querySelector(face)).width);
      const la = wide('.la'), te = wide('.te');
      if (size > 0 && la > 0 && te > 0) { c.style.setProperty('--la', la / size + 'em'); c.style.setProperty('--te', te / size + 'em'); }
    });
  }
  measure();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);     // the Telugu font arrives after the page
  window.addEventListener('load', measure);

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(() => {
    if (document.hidden || home.hidden) return;        // nobody is looking at the title
    title.classList.toggle('is-te');
  }, FLIP_EVERY);
})();
</script>
</body>
</html>
