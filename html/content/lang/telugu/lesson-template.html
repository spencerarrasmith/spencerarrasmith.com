<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lesson Template · Telugu Suite</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="lesson"></div>

<script src="settings.js"></script>
<script src="units.js"></script>
<script src="telugu-data.js"></script>
<script src="progress.js"></script>
<script src="lesson-shell.js"></script>
<script>
/* ═════════════════════════════════════════════════════════
   LESSON TEMPLATE — copy this file to start a new unit.

   1. Save the copy over the unit's placeholder in its section folder
      (e.g. grammar/02_nouns.html) so the home tile opens it, and put ../
      in front of the six links above (shell.css, settings.js, units.js,
      telugu-data.js, progress.js, lesson-shell.js), since the page now sits
      one folder down.
   2. Set `id` to the unit's tile id from units.js. Using the template's own
      id below would mark "lesson-template" as done in your progress.
      Then delete `section` and `title`: with a real tile id they come
      from units.js (the template keeps them only because it has no tile).
   3. Replace learn / remarks / practice with the unit's content.
   4. In units.js, delete the `soon` block from the unit's tile.

   Everything on this page is demo content, written only to show
   each feature: it is not a real lesson.
═════════════════════════════════════════════════════════ */
const N = TeluguData.notation;     // how sounds are written: IPA (/k/) or ISO (ka), chosen on the home page

LessonShell.mount({
  id:      'lesson-template',
  section: 'Template',
  title:   'Lesson Template',
  telugu:  'తెలుగు',

  learn: [
    { h: 'What This Part Is For' },
    'Learn holds the explanation. Plain strings become paragraphs, and you can mix block types freely.',
    { list: ['Bullets for short facts', 'Tables for paradigms', 'Examples for Telugu with English'] },
    { table: {
        head: ['Letter', 'Sound', 'Group'],
        rows: TeluguData.consonants.slice(0, 4).map(c => [`<span class="te">${c.ch}</span>`, N.wrap(N.letter(c)), c.cat]),
    } },
    { examples: [
        { te: 'క', en: 'the first consonant' },                                  // a single character: its sound is filled in
        { te: 'కా', en: 'the same consonant with the long vowel sign' },
        { te: 'కాకి', en: 'crow', ipa: 'kaːki', iso: 'kāki' },                    // a word: give both spellings
    ] },
  ],

  remarks: [
    'Remarks are short asides: exceptions, things that trip learners up, how this connects to other units.',
    { h: 'Tip' },
    { p: 'Anything long-winded belongs in Learn; keep remarks to a sentence or two each.' },
  ],

  practice(el, ctx) {
    // Practice is free-form: build whatever the unit needs inside `el`.
    // This demo is a four-letter pick-the-sound drill.
    const letters = TeluguData.consonants.slice(0, 4);
    const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
    let deck = shuffle(letters), attempts = 0, cleared = 0;

    el.innerHTML = `
      <div class="bar"><i id="d-bar"></i></div>
      <div class="fc" style="margin-top:14px">
        <div class="prompt te" id="d-prompt"></div>
        <div class="answer" id="d-fb" aria-live="polite">&nbsp;</div>
      </div>
      <div class="fc-actions" id="d-opts" style="flex-wrap:wrap"></div>`;
    const $ = id => el.querySelector('#' + id);

    function render() {
      if (!deck.length) {
        $('d-prompt').textContent = '✓';
        $('d-fb').textContent = 'Done';
        $('d-opts').innerHTML = '';
        return;
      }
      $('d-prompt').textContent = deck[0].ch;
      $('d-bar').style.width = (cleared / letters.length * 100) + '%';
      $('d-opts').innerHTML = shuffle(letters).map(l =>
        `<button class="btn" data-ipa="${l.ipa}">${N.wrap(N.letter(l))}</button>`).join('');
    }

    $('d-opts').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const cur = deck[0]; attempts++;
      if (b.dataset.ipa === cur.ipa) { deck.shift(); cleared++; $('d-fb').textContent = '✓'; }
      else {
        $('d-fb').textContent = '✗  ' + N.wrap(N.letter(cur));
        ctx.miss({ key: cur.ch, ask: 'telugu', note: cur.cat });   // → shows up in Review, in the reader's notation
        deck.push(deck.shift());
      }
      render();
    });
    render();
  },
});
</script>
</body>
</html>
