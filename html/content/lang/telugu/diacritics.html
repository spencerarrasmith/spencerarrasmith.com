<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Diacritics</title>
  <link rel="stylesheet" href="game.css">
  <style>
    /* ── Diacritics-specific (everything shared lives in game.css) ── */

    /* Syllable glyphs are wider than single letters */
    .tel-char { font-size: 4.6rem; margin-top: 22px; }   /* centres these glyphs like the other games */

    .slot { min-width: 120px; }

    /* Two keyboards: consonants (left) and vowels (right) */
    .kb-cols {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .kb-col, .kb-col-keys { display: flex; flex-direction: column; gap: 9px; }

    .kb-col-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .12em;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* Reversed: vowel signs are small marks, so their keys run a little larger */
    .kb-btn.sign {
      font-size: 26px;
      line-height: 1.2;
      padding: 3px 13px;
    }

    /* Pending selection (before both pieces are chosen) */
    .kb-btn.sel:not(.ok):not(.err) {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent-light);
    }

    @media (max-width: 680px) {
      .kb-cols { grid-template-columns: 1fr; }
      .kb-col[data-kind="v"] { order: -1; }   /* short vowel panel first */
    }
  </style>
</head>
<body>
<div class="game-wrap">

  <!-- ── Progress header ── -->
  <header class="g-header">
    <div class="g-header-top">
      <div class="g-title-row">
        <span class="g-title" id="g-title">Diacritics → IPA</span>
        <button class="rev-btn" id="rev-btn" type="button" aria-pressed="false"
                aria-label="Reverse direction: IPA to Diacritics" title="Reverse direction">🔀</button>
      </div>
      <div class="g-right">
        <div class="g-stats">
          <span>Remaining&nbsp;<span class="g-stat-val" id="s-rem">0</span></span>
          <span>Correct&nbsp;<span class="g-stat-val" id="s-done">0</span>/<span class="g-stat-val" id="s-total">0</span></span>
        </div>
        <div class="menu-wrap" id="menu-wrap">
          <button class="menu-btn" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false"
                  aria-controls="opts-menu" aria-label="Options" title="Options">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="2.8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="8" cy="13.2" r="1.6"/></svg>
          </button>
          <div class="menu" id="opts-menu" role="group" aria-label="Options" hidden>
            <label class="menu-opt"><input type="checkbox" id="show-cat" checked> <span class="menu-txt"><span>Show categories</span><span class="menu-note" id="cat-note" hidden>Off while keyboard is shuffled</span></span></label>
            <label class="menu-opt"><input type="checkbox" id="shuffle-kb"> <span>Shuffle keyboard</span></label>
            <label class="menu-opt"><input type="checkbox" id="include-extra"> <span>Include extra letters</span></label>
          </div>
        </div>
      </div>
    </div>
    <div class="g-prog-track">
      <div class="g-prog-fill" id="prog-fill"></div>
    </div>
  </header>

  <!-- ── Game main ── -->
  <div class="g-main" id="g-main">
    <div class="card-area">
      <div class="char-card" id="char-card">
        <span class="cat-badge" id="cat-badge"></span>
        <span class="tel-char" id="tel-char"></span>
        <span class="rare-badge" id="rare-badge" style="display:none">rare</span>
      </div>
      <div class="slots">
        <div class="slot" id="slot-c">Consonant <span class="slot-val">–</span></div>
        <div class="slot" id="slot-v">Vowel <span class="slot-val">–</span></div>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="kb-area" id="kb-area"></div>
  </div>

  <!-- ── Complete screen ── -->
  <div class="g-complete" id="g-complete">
    <div class="trophy">🏆</div>
    <div class="c-title">Session Complete!</div>
    <div class="c-sub" id="c-sub"></div>
    <div class="c-stats">
      <div class="c-stat">
        <span class="c-stat-val" id="c-attempts">—</span>
        <span class="c-stat-lbl">Total Attempts</span>
      </div>
      <div class="c-stat">
        <span class="c-stat-val" id="c-accuracy">—</span>
        <span class="c-stat-lbl">Accuracy</span>
      </div>
      <div class="c-stat">
        <span class="c-stat-val" id="c-errors">—</span>
        <span class="c-stat-lbl">Errors</span>
      </div>
    </div>
    <button class="retry-btn" id="retry-btn">Practice Again</button>
  </div>

</div>

<script src="telugu-data.js"></script>
<script src="progress.js"></script>
<script src="game-menu.js"></script>
<script>
if (!window.TeluguData) throw new Error('telugu-data.js was not found next to this page');

/* ─────────────────────────────────────────────────────────
   DATA
   A card is one consonant + one vowel sign. To clear it the
   player picks BOTH the consonant phoneme and the vowel sound.
   Letters, signs and flags come from telugu-data.js:
     rare    → "rare" badge
     inBook  → false for the extras (ఱ ౢ ౣ), hidden until
               "Include extra letters" is ticked
───────────────────────────────────────────────────────── */
const GAME       = 'diacritics';
const CONSONANTS = [...TeluguData.consonants, ...TeluguData.conjunctLetters];   // ends with క్ష
const VOWELS     = TeluguData.signs;
const Progress   = window.TeluguProgress || { miss() {}, complete() {} };

const PER_VOWEL = 3;     // cards per vowel sign (each with a different consonant)
const OK_MS     = 500;   // pause after a correct round
const ERR_MS    = 1000;  // pause after a wrong round (two answers to read)

/* ─────────────────────────────────────────────────────────
   STATE
───────────────────────────────────────────────────────── */
let deck = [], completed = 0, attempts = 0, locked = false, total = 0;
let reversed = false;             // false: card shows the syllable, keys show IPA
                                  // true:  card shows the sound, keys show Telugu
let sel = { c: null, v: null };   // pending picks (the key's IPA, whichever face it wears)
let keys    = { c: [], v: [] };   // what is on the two keyboards, in alphabet order
let kbOrder = null;               // null, or { c, v }: shuffled copies (fixed for the round)

/* ─────────────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// [[label, [items…]], …] keeping first-seen order
function groupBy(items, key) {
  const m = new Map();
  items.forEach(it => {
    if (!m.has(it[key])) m.set(it[key], []);
    m.get(it[key]).push(it);
  });
  return [...m];
}

// Every vowel sign gets PER_VOWEL cards, each with a different random consonant
function buildDeck(cons, vows) {
  const cards = [];
  vows.forEach(v => {
    shuffle(cons).slice(0, PER_VOWEL).forEach(c => cards.push({
      c, v,
      glyph:    c.ch + v.sign,
      cat:      c.cat,
      rare:     c.rare || v.rare,
    }));
  });
  return shuffle(cards);
}
// <<TEST-END>>

// A vowel sign can't stand alone, so each key shows it on క, the way
// textbooks do (కా కి కీ …). The "no sign" key is plain క: the consonant's
// own short a. (An isolated mark would get a dotted circle, which each
// browser draws differently.)
const SIGN_BASE = '\u0C15';
const signLabel = v => SIGN_BASE + v.sign;

// What a pending pick looks like in its slot, in the current direction
function pickLabel(kind, ipa) {
  if (!reversed) return ipa;
  return kind === 'c' ? CONSONANTS.find(c => c.ipa === ipa).ch
                      : signLabel(VOWELS.find(v => v.ipa === ipa));
}

function btnFor(kind, ipa) {
  return Array.from(document.querySelectorAll(`.kb-btn[data-kind="${kind}"]`))
    .find(b => b.dataset.ipa === ipa) || null;
}

/* ─────────────────────────────────────────────────────────
   BUILD KEYBOARDS
───────────────────────────────────────────────────────── */
function buildPanel(title, kind, items, key, grouped) {
  const col = document.createElement('div');
  col.className    = 'kb-col';
  col.dataset.kind = kind;

  const h = document.createElement('div');
  h.className   = 'kb-col-title';
  h.textContent = title;
  col.appendChild(h);

  // Reversed consonants: the Telugu letter keyboard shared with Phonemes
  // (telugu-data.js), restricted to the consonants on this page.
  if (reversed && kind === 'c') {
    const body = document.createElement('div');
    body.className = 'kb-col-keys';
    TeluguData.buildKeyboard(body, {
      face:       'telugu',
      visible:    new Set(items),
      skipHidden: true,
      grouped,
      order:      items,                    // only used when ungrouped
      onPick:     (l, btn) => onPick('c', l.ipa, btn),
    }).forEach(b => { b.dataset.kind = 'c'; });
    col.appendChild(body);
    return col;
  }

  // Grouped: one labelled block per category. Ungrouped: a single plain block.
  (grouped ? groupBy(items, key) : [[null, items]]).forEach(([label, list]) => {
    const g = document.createElement('div');
    g.className = 'kb-group';

    const row = document.createElement('div');
    row.className = 'kb-row';
    list.forEach(it => {
      const btn = document.createElement('button');
      btn.className   = 'kb-btn' + (reversed ? ' te sign' : '');
      btn.textContent = reversed ? signLabel(it) : it.ipa;
      if (reversed && it.sign === '') btn.setAttribute('aria-label', 'no sign: the consonant on its own');
      btn.dataset.ipa  = it.ipa;
      btn.dataset.kind = kind;
      btn.addEventListener('click', () => onPick(kind, it.ipa, btn));
      row.appendChild(btn);
    });

    if (label !== null) {
      const l = document.createElement('div');
      l.className   = 'kb-label';
      l.textContent = label;
      g.appendChild(l);
    }
    g.appendChild(row);
    col.appendChild(g);
  });
  return col;
}

// Both panels follow the options menu:
//   Show categories ticked   → grouped and labelled
//   Show categories unticked → one plain block per panel, alphabet order
//   Shuffle keyboard ticked  → that block in a random order (kbOrder), which
//                              stays fixed for the round so keys can be found
// Rebuilding (e.g. when an option changes) never restarts the round.
function buildKB() {
  const grouped = GameMenu.grouped();
  const src     = grouped ? keys : (kbOrder || keys);
  const area = $('kb-area');
  area.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'kb-cols';
  wrap.append(
    buildPanel('Consonant', 'c', src.c, 'cat', grouped),
    buildPanel(reversed ? 'Vowel sign (on క)' : 'Vowel', 'v', src.v, 'grp', grouped),
  );
  area.appendChild(wrap);

  // keep a half-made answer visible across a rebuild
  if (!locked) ['c', 'v'].forEach(k => {
    const b = sel[k] !== null && btnFor(k, sel[k]);
    if (b) b.classList.add('sel');
  });
}

const escHtml = s => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IPA_SIZE = ['', '5rem', '5rem', '4.2rem', '3.6rem', '3.1rem', '2.7rem'];   // by length of the sound; the last applies to anything longer

const newOrder = () => ({ c: shuffle(keys.c), v: shuffle(keys.v) });

/* ─────────────────────────────────────────────────────────
   ROUND STATE + RENDER
───────────────────────────────────────────────────────── */
function updateSlots() {
  [['c', 'slot-c'], ['v', 'slot-v']].forEach(([k, id]) => {
    const slot = $(id);
    const has  = sel[k] !== null;
    slot.classList.toggle('filled', has);
    const val = slot.querySelector('.slot-val');
    val.textContent = has ? pickLabel(k, sel[k]) : '–';
    val.classList.toggle('te', reversed && has);
  });
}

function clearRound() {
  sel = { c: null, v: null };
  document.querySelectorAll('.kb-btn').forEach(b => b.classList.remove('sel', 'ok', 'err'));
  ['slot-c', 'slot-v'].forEach(id => $(id).classList.remove('ok', 'err'));
  updateSlots();
}

function renderCard() {
  const c = deck[0];
  const tel = $('tel-char');
  if (reversed) {
    // the sound, written /like this/; longer strings (kʰaː, tʃʰai) step down a size
    const sound = c.c.ipa + c.v.sound, n = [...sound].length;
    tel.className      = 'tel-char ipa-face';
    tel.innerHTML      = `<span class="sl">/</span>${escHtml(sound)}<span class="sl">/</span>`;
    tel.style.fontSize = IPA_SIZE[Math.min(n, IPA_SIZE.length - 1)];
  } else {
    tel.className      = 'tel-char';
    tel.textContent    = c.glyph;
    tel.style.fontSize = '';
  }

  const badge = $('cat-badge');
  badge.textContent      = c.cat;
  badge.style.visibility = $('show-cat').checked ? '' : 'hidden';
  $('rare-badge').style.display = c.rare ? '' : 'none';

  const fb = $('feedback');
  fb.textContent = '';
  fb.className   = 'feedback';
  $('char-card').className = 'char-card';
  clearRound();
}

function updateProg() {
  $('s-rem').textContent   = deck.length;
  $('s-done').textContent  = completed;
  $('s-total').textContent = total;
  $('prog-fill').style.width = (total ? completed / total * 100 : 0).toFixed(1) + '%';
}

/* ─────────────────────────────────────────────────────────
   ANSWER HANDLING
   Picking one piece only marks it; the round is judged as
   soon as BOTH a consonant and a vowel have been chosen.
───────────────────────────────────────────────────────── */
function onPick(kind, ipa, btn) {
  if (locked) return;
  sel[kind] = ipa;
  document.querySelectorAll(`.kb-btn[data-kind="${kind}"]`)
    .forEach(b => b.classList.toggle('sel', b === btn));
  updateSlots();
  if (sel.c !== null && sel.v !== null) evaluate();
}

function evaluate() {
  locked = true;
  attempts++;

  const cur    = deck[0];
  const answer = { c: cur.c.ipa, v: cur.v.ipa };
  const allOk  = sel.c === answer.c && sel.v === answer.v;
  const card   = $('char-card');
  const fb     = $('feedback');
  let scrollTarget = null;

  ['c', 'v'].forEach(k => {
    const good   = sel[k] === answer[k];
    const picked = btnFor(k, sel[k]);
    picked.classList.remove('sel');
    picked.classList.add(good ? 'ok' : 'err');
    $(k === 'c' ? 'slot-c' : 'slot-v').classList.add(good ? 'ok' : 'err');

    if (!good) {
      const right = btnFor(k, answer[k]);
      if (right) {
        right.classList.add('ok');
        scrollTarget = scrollTarget || right;
      }
    }
  });

  const sound = `/${cur.c.ipa}${cur.v.sound}/`;
  fb.textContent = `${allOk ? '✓' : '✗'}  ${reversed ? cur.glyph : sound}`;
  fb.className   = 'feedback ' + (allOk ? 'ok' : 'err') + (reversed ? ' te' : '');
  if (!allOk) Progress.miss(reversed
    ? { game: GAME + '-reverse', key: cur.glyph, prompt: sound, answer: cur.glyph, note: cur.v.grp }
    : { game: GAME,              key: cur.glyph, prompt: cur.glyph, answer: sound, note: cur.v.grp });

  if (allOk) {
    card.classList.add('correct');
    deck.shift();
    completed++;
    updateProg();
    setTimeout(() => {
      if (deck.length === 0) showComplete();
      else { renderCard(); locked = false; }
    }, OK_MS);
  } else {
    card.classList.add('wrong');
    if (scrollTarget) scrollTarget.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Reinsert at a random position (never straight back to the front)
    const removed  = deck.shift();
    const insertAt = Math.max(1, Math.floor(Math.random() * (deck.length + 1)));
    deck.splice(insertAt, 0, removed);

    setTimeout(() => { renderCard(); locked = false; }, ERR_MS);
  }
}

/* ─────────────────────────────────────────────────────────
   COMPLETE SCREEN
───────────────────────────────────────────────────────── */
function showComplete() {
  $('g-main').style.display = 'none';
  $('g-complete').classList.add('show');

  $('c-sub').textContent = reversed
    ? `All ${total} sounds correctly written as Telugu syllables.`
    : `All ${total} syllables correctly matched to their IPA sounds.`;
  $('c-attempts').textContent = attempts;
  $('c-accuracy').textContent = Math.round(total / attempts * 100) + '%';
  $('c-errors').textContent   = attempts - total;
  Progress.complete(GAME, { accuracy: Math.round(total / attempts * 100), attempts });
}

/* ─────────────────────────────────────────────────────────
   INIT
───────────────────────────────────────────────────────── */
function initGame() {
  const all  = $('include-extra').checked;
  const cons = TeluguData.pool(CONSONANTS, all);
  const vows = TeluguData.pool(VOWELS, all);

  deck      = buildDeck(cons, vows);
  total     = deck.length;
  completed = 0;
  attempts  = 0;
  locked    = false;

  $('g-complete').classList.remove('show');
  $('g-main').style.display = '';
  $('kb-area').scrollTop = 0;

  keys    = { c: cons, v: vows };
  kbOrder = GameMenu.shuffled() ? newOrder() : null;   // fresh order each round
  buildKB();
  updateProg();
  renderCard();
}

// 🔀 flips direction and starts a fresh round in the new direction
function setReversed(rev) {
  reversed = rev;
  const btn = $('rev-btn');
  btn.setAttribute('aria-pressed', String(rev));
  btn.setAttribute('aria-label', rev ? 'Reverse direction: Diacritics to IPA' : 'Reverse direction: IPA to Diacritics');
  $('g-title').textContent = rev ? 'IPA → Diacritics' : 'Diacritics → IPA';
  initGame();
}
$('rev-btn').addEventListener('click', () => setReversed(!reversed));

// ⋮ menu: open/close, "Show categories" and "Shuffle keyboard" live in game-menu.js
GameMenu.init({
  rebuild: buildKB,
  reorder: on => { kbOrder = on ? newOrder() : null; },
});
$('include-extra').addEventListener('change', initGame);
$('retry-btn').addEventListener('click', initGame);
initGame();
</script>
</body>
</html>
