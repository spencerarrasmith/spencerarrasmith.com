name: Docker Image CI

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z)'
        required: true
        default: '0.0.0'

jobs:
  test:
    uses: spencerarrasmith/spencerarrasmith-telugu-tests/.github/workflows/test.yml@main

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build, check, and push
        run: |
          IMAGE=ghcr.io/spencerarrasmith/spencerarrasmith.com
          VERSION=${{ steps.ver.outputs.version }}
          docker build . \
            --file Dockerfile \
            --build-arg GIT_TAG=$VERSION \
            --tag $IMAGE:${{ steps.ver.outputs.version }} \
            --tag $IMAGE:latest
          # Start the new image and ask it for a few files the way Caddy does. An image that
          # does not compress them, or sends the wrong cache headers, is not pushed.
          docker run --detach --rm --name check --publish 127.0.0.1:8001:80 $IMAGE:$VERSION
          sleep 2
          tools/check-server.sh http://127.0.0.1:8001
          docker stop check
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
