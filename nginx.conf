events {}

http {
    include      /etc/nginx/mime.types;
    types { text/markdown md; }
    default_type application/octet-stream;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json
               image/svg+xml text/markdown;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }

        location /img/ {
            add_header Cache-Control "public, max-age=604800";
        }

        # The Telugu app's own font files. Each carries a version in its name
        # (inter-v1.woff2), so a browser can keep one for a year without asking again.
        location /content/lang/telugu/fonts/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        real_ip_header X-Forwarded-For;
        set_real_ip_from 127.0.0.1;   # Caddy is on the same host
    }
}