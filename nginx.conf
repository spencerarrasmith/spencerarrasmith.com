events {}

http {
    include      /etc/nginx/mime.types;
    types { text/markdown md; }
    default_type application/octet-stream;

    server_tokens off;
    # Compression. Every request reaches this server through Caddy, and Caddy marks what it
    # forwards with a Via header. nginx sends no compressed answer to a request that carries
    # one unless gzip_proxied says it may, so without that line "gzip on" does nothing here.
    gzip on;
    gzip_proxied any;
    gzip_vary on;            # adds "Vary: Accept-Encoding", so a cache keeps the two forms apart
    gzip_comp_level 6;       # the default is 1; 6 is about 7% smaller for these files
    gzip_min_length 256;     # a smaller file fits in one packet either way
    gzip_types text/css application/javascript application/json
               image/svg+xml text/markdown text/plain;      # text/html is always included

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }

        location /img/ {
            add_header Cache-Control "public, max-age=604800";
        }

        # The Telugu app's own font files. Each carries a version in its name
        # (inter-v1.woff2), so a browser can keep one for a year without asking again.
        location /content/lang/telugu/fonts/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Other people's code the Telugu app ships with (the PocketBase client). The version is
        # in each file's name too (pocketbase-0.29.0.umd.js), so it may be kept just as long.
        location /content/lang/telugu/vendor/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        real_ip_header X-Forwarded-For;
        set_real_ip_from 127.0.0.1;   # Caddy is on the same host
    }
}